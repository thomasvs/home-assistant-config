- sensor:
    name: "Spotify Playlists"
    unique_id: spotify_playlists
    command: "cat /config/spotify_playlists.json"
    value_template: "ok"
    json_attributes:
      - list

- sensor:
    name: "Spotify Target Devices"
    unique_id: spotify_target_devices
    command: "cat /config/spotify_target_devices.json"
    value_template: "ok"
    json_attributes:
      - list

