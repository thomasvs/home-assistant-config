# Ghost Mode: 'Poltergeist Static / Ring Girl' Display Idle Interruption Package
# Targets:
# - Balcony display (media_player.balcony_display) - Google Cast video/mp4
# - Kitchen tablet (media_player.pixel_tablet) - Google Cast video/mp4
# - Cozyla frame (notify.mobile_app_cozyla / device_tracker.cd_8r544f2) - High-priority webview popup
# - Meural Canvas (media_player.living_room_mural) - meural.preview_image still JPEG
# NOTE: Living Room TV is strictly EXCLUDED (never touches switch.power_tv,
# media_player.living_room_tv_cast_cast, media_player.living_room_tv_universal,
# or media_player.onkyo_tx_nr809).
#
# Provides:
# - timer.ghost_tv_cooldown (Cooldown between unprompted display interruptions)
# - input_boolean.ghost_tv_interruption (Toggle for display jumpscares)
# - script.ghost_tv_poltergeist (Main interruption script targeting displays with state restore)
# - automation.halloween_ghost_tv_idle_interruption (Automated ambient trigger)

input_boolean:
  ghost_tv_interruption:
    name: "Possessed Display Interruption"
    icon: mdi:television-classic
    initial: on

timer:
  ghost_tv_cooldown:
    name: "Ghost TV Cooldown"
    duration: "00:45:00"
    icon: mdi:timer-sand

script:
  ghost_tv_poltergeist:
    alias: "Ghost: Poltergeist Static / Ring Interruption"
    description: "Interrupts idle Balcony display, Kitchen tablet, Cozyla frame, and Meural canvas with 10s of Poltergeist static or The Ring well scare without touching Living Room TV."
    mode: restart
    fields:
      target_display:
        description: "Target display: 'all' (all eligible idle displays), 'random' (pick one eligible), or specific ('balcony', 'kitchen_tablet', 'cozyla', 'meural')"
        example: "all"
        default: "all"
      video_type:
        description: "Video asset: 'static' (1980s Poltergeist white-noise), 'ring' (The Ring well), or custom URL"
        example: "static"
        default: "static"
      duration:
        description: "Duration of scare video in seconds"
        example: 10
        default: 10
      force:
        description: "Bypass safety/idle gating (for manual testing/triggering)"
        example: false
        default: false
      restore_power:
        description: "Whether to restore display power/source states after scare"
        example: true
        default: true
    sequence:
      # 1. Gate on Ghost Mode, Nesting Parent != Natalia, and House Mode Awake
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              is_state('input_boolean.ghost_mode', 'on') and
              states('input_select.nesting_parent') != 'Natalia' and
              is_state('input_select.mode_house', 'Awake')
            )
          }}

      # 2. Check at least one target display is idle/available
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              states('media_player.balcony_display') not in ['playing', 'buffering', 'unavailable', 'unknown'] or
              states('media_player.pixel_tablet') not in ['playing', 'buffering', 'unavailable', 'unknown'] or
              is_state('device_tracker.cd_8r544f2', 'home') or
              states('media_player.living_room_mural') not in ['unavailable', 'unknown']
            )
          }}

      # 3. Capture pre-interruption states & resolve media URLs
      - variables:
          target: "{{ target_display | default('all') }}"
          v_type: "{{ video_type | default('static') }}"
          play_duration: "{{ duration | default(10) | int }}"
          # Resolved Cast video URL (for Balcony display and Kitchen Pixel tablet)
          resolved_media: >-
            {% if v_type == 'ring' %}
              media-source://media_source/local/halloween/ring_girl.mp4
            {% elif v_type == 'static' %}
              media-source://media_source/local/halloween/poltergeist_static.mp4
            {% else %}
              {{ v_type }}
            {% endif %}
          # Cozyla local webview path
          cozyla_path: >-
            {% if v_type == 'ring' %}
              /local/halloween/ring_girl.mp4
            {% elif v_type == 'static' %}
              /local/halloween/poltergeist_static.mp4
            {% else %}
              {{ v_type }}
            {% endif %}
          # Meural still JPEG image URL
          meural_image: >-
            {% if v_type == 'ring' %}
              /local/halloween/ring_girl.jpg
            {% elif v_type == 'static' %}
              /local/halloween/poltergeist_static.jpg
            {% else %}
              {{ v_type }}
            {% endif %}
          initial_balcony_state: "{{ states('media_player.balcony_display') }}"
          initial_tablet_state: "{{ states('media_player.pixel_tablet') }}"
          initial_meural_state: "{{ states('media_player.living_room_mural') }}"
          initial_meural_source: "{{ state_attr('media_player.living_room_mural', 'source') | default('Halloween', true) }}"
          # Determine eligibility for each display
          balcony_eligible: >-
            {{ (target in ['all', 'balcony'] or target == 'random') and (force | default(false) or initial_balcony_state not in ['playing', 'buffering', 'unavailable', 'unknown']) }}
          tablet_eligible: >-
            {{ (target in ['all', 'kitchen_tablet'] or target == 'random') and (force | default(false) or initial_tablet_state not in ['playing', 'buffering', 'unavailable', 'unknown']) }}
          cozyla_eligible: >-
            {{ (target in ['all', 'cozyla'] or target == 'random') and (force | default(false) or is_state('device_tracker.cd_8r544f2', 'home')) }}
          meural_eligible: >-
            {{ (target in ['all', 'meural'] or target == 'random') and (force | default(false) or initial_meural_state not in ['unavailable', 'unknown']) }}

      - service: logbook.log
        data:
          name: "Ghost: Poltergeist Interruption"
          message: "Triggered display poltergeist jumpscare ({{ v_type }} on {{ target }})."
          entity_id: script.ghost_tv_poltergeist
          domain: script

      # 4. Dispatch scare to eligible displays
      # 4a. Balcony display (Google Cast video)
      - if:
          - condition: template
            value_template: "{{ balcony_eligible }}"
        then:
          - service: media_player.turn_on
            continue_on_error: true
            target:
              entity_id: media_player.balcony_display
          - service: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: media_player.balcony_display
            data:
              volume_level: 0.65
          - service: media_player.play_media
            continue_on_error: true
            target:
              entity_id: media_player.balcony_display
            data:
              media_content_id: "{{ resolved_media }}"
              media_content_type: "video/mp4"

      # 4b. Kitchen Pixel Tablet (Google Cast video)
      - if:
          - condition: template
            value_template: "{{ tablet_eligible }}"
        then:
          - service: media_player.turn_on
            continue_on_error: true
            target:
              entity_id: media_player.pixel_tablet
          - service: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: media_player.pixel_tablet
            data:
              volume_level: 0.65
          - service: media_player.play_media
            continue_on_error: true
            target:
              entity_id: media_player.pixel_tablet
            data:
              media_content_id: "{{ resolved_media }}"
              media_content_type: "video/mp4"

      # 4c. Cozyla Smart Frame (Screen on + Webview popup)
      - if:
          - condition: template
            value_template: "{{ cozyla_eligible }}"
        then:
          - service: notify.mobile_app_cozyla
            continue_on_error: true
            data:
              message: "command_screen_on"
              data:
                ttl: 0
                priority: high
          - delay:
              milliseconds: 500
          - service: notify.mobile_app_cozyla
            continue_on_error: true
            data:
              message: "command_webview"
              data:
                command: "{{ cozyla_path }}"
                ttl: 0
                priority: high

      # 4d. Meural Canvas (meural.preview_image still JPEG)
      - if:
          - condition: template
            value_template: "{{ meural_eligible }}"
        then:
          - service: meural.preview_image
            continue_on_error: true
            target:
              entity_id: media_player.living_room_mural
            data:
              content_url: "{{ meural_image }}"
              content_type: "image/jpeg"

      # 5. Sustain scare for duration (default 10s)
      - delay:
          seconds: "{{ play_duration }}"

      # 6. Cleanly restore states without touching Living Room TV
      # 6a. Balcony display restore
      - if:
          - condition: template
            value_template: "{{ balcony_eligible }}"
        then:
          - service: media_player.media_stop
            continue_on_error: true
            target:
              entity_id: media_player.balcony_display
          - if:
              - condition: template
                value_template: "{{ restore_power and initial_balcony_state == 'off' }}"
            then:
              - service: media_player.turn_off
                continue_on_error: true
                target:
                  entity_id: media_player.balcony_display

      # 6b. Kitchen Pixel Tablet restore
      - if:
          - condition: template
            value_template: "{{ tablet_eligible }}"
        then:
          - service: media_player.media_stop
            continue_on_error: true
            target:
              entity_id: media_player.pixel_tablet
          - if:
              - condition: template
                value_template: "{{ restore_power and initial_tablet_state == 'off' }}"
            then:
              - service: media_player.turn_off
                continue_on_error: true
                target:
                  entity_id: media_player.pixel_tablet

      # 6c. Cozyla restore (dismiss webview)
      - if:
          - condition: template
            value_template: "{{ cozyla_eligible }}"
        then:
          - service: notify.mobile_app_cozyla
            continue_on_error: true
            data:
              message: "command_webview"
              data:
                ttl: 0
                priority: high

      # 6d. Meural Canvas restore (restore gallery)
      - if:
          - condition: template
            value_template: "{{ meural_eligible }}"
        then:
          - service: media_player.select_source
            continue_on_error: true
            target:
              entity_id: media_player.living_room_mural
            data:
              source: "{{ initial_meural_source }}"

automation:
  - id: halloween_ghost_tv_idle_interruption
    alias: "Halloween Ghost Mode: TV Poltergeist Idle Interruption"
    description: "Triggers Poltergeist static or Ring girl video on idle Balcony display, Kitchen tablet, Cozyla, or Meural during Ghost Mode."
    trigger:
      - trigger: time_pattern
        minutes: "14, 44"
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          node_id: 95
          label: "Scene 001"
          value: "KeyPressed"
    condition:
      - condition: template
        value_template: "{{ now().minute not in [0, 30] }}"
      - condition: state
        entity_id: input_boolean.ghost_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.ghost_tv_interruption
        state: "on"
      - condition: template
        value_template: "{{ states('input_select.nesting_parent') != 'Natalia' }}"
      - condition: state
        entity_id: input_select.mode_house
        state: "Awake"
      - condition: state
        entity_id: timer.ghost_tv_cooldown
        state: "idle"
      - condition: template
        value_template: >-
          {{
            states('media_player.balcony_display') not in ['playing', 'buffering', 'unavailable', 'unknown'] or
            states('media_player.pixel_tablet') not in ['playing', 'buffering', 'unavailable', 'unknown'] or
            is_state('device_tracker.cd_8r544f2', 'home') or
            states('media_player.living_room_mural') not in ['unavailable', 'unknown']
          }}
    action:
      - delay:
          seconds: "{{ range(20, 110) | random }}"
      - condition: template
        value_template: "{{ now().minute not in [0, 30] }}"
      - service: timer.start
        target:
          entity_id: timer.ghost_tv_cooldown
        data:
          duration: "00:{{ range(35, 55) | random }}:{{ range(10, 59) | random }}"
      - service: script.ghost_tv_poltergeist
        data:
          target_display: "all"
          video_type: "static"
          duration: 10
