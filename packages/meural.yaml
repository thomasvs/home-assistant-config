rest_command:      
  meural_left:
    url: "http://192.168.1.109/remote/control_command/set_key/left"
    verify_ssl: false
  meural_right:
    url: "http://192.168.1.109/remote/control_command/set_key/right"
    verify_ssl: false
  meural_up:
    url: "http://192.168.1.109/remote/control_command/set_key/up"
    verify_ssl: false
  meural_down:
    url: "http://192.168.1.109/remote/control_command/set_key/down"
    verify_ssl: false
  meural_suspend:
    url: "http://192.168.1.109/remote/control_command/suspend"
    verify_ssl: false
  meural_resume:
    url: "http://192.168.1.109/remote/control_command/resume"
    verify_ssl: false
  meural_autocalibratebacklight:
    url: "http://192.168.1.109/remote/control_command/als_calibrate/off"
    verify_ssl: false
  meural_setlandscape:
    url: "http://192.168.1.109/remote/control_command/set_orientation/landscape"
    verify_ssl: false
  meural_setbacklight:
    url: "http://192.168.1.109/remote/control_command/set_backlight/{{ backlight | default(states('input_number.meural_canvas_backlight') | int) }}"
    verify_ssl: false
  meural_setportrait:
    url: "http://192.168.1.109/remote/control_command/set_orientation/portrait"
    verify_ssl: false

input_number:
  meural_canvas_backlight:
    name: Meural Backlight
    initial: 80
    min: 0
    max: 100
    step: 1
    icon: mdi:brightness-6

sensor:
  - platform: rest
    resource: http://192.168.1.109/remote/get_backlight
    name: Meural Backlight
    value_template: "{{ value_json.response }}"
    scan_interval: 60

automation:
  - id: meural_sync_backlight_slider
    alias: "Meural Sync Backlight Slider"
    trigger:
      - platform: state
        entity_id: input_number.meural_canvas_backlight
    action:
      - service: rest_command.meural_setbacklight
        data:
          backlight: "{{ trigger.to_state.state | int }}"

template:
  - light:
      - name: "Meural"
        unique_id: meural_canvas_light
        state: "{{ states('sensor.meural_backlight') not in ['unavailable', 'unknown', 'none', '0'] }}"
        brightness: "{{ (states('sensor.meural_backlight') | float(80) / 100 * 255) | int }}"
        turn_on:
          - service: rest_command.meural_resume
        turn_off:
          - service: rest_command.meural_suspend
        set_brightness:
          - service: input_number.set_value
            data:
              entity_id: input_number.meural_canvas_backlight
              value: "{{ (brightness / 255 * 100) | round(0) | int }}"
          - service: rest_command.meural_setbacklight
            data:
              backlight: "{{ (brightness / 255 * 100) | round(0) | int }}"


