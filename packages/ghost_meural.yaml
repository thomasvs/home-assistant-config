# Ghost Mode: AI-Creepified Meural Photo Overlays Package
# Provides:
# - input_boolean.ghost_meural (Toggle for Haunted Meural art overlays)
# - input_select.ghost_meural_effect (Effect selector)
# - timer.ghost_meural_cooldown (Short debounce cooldown between Meural overlay pushes)
# - script.ghost_meural_creepify (Display item-aware creepified overlay on Meural Canvas)
# - script.ghost_meural_restore (Restore normal Halloween gallery on Meural Canvas)
# - automation.halloween_ghost_meural_motion_trigger (Continuous / gallery-sync / motion trigger)
# - automation.halloween_ghost_meural_restore (Restore normal gallery when Ghost Mode turns off)

input_boolean:
  ghost_meural:
    name: "Possessed Meural Art"
    icon: mdi:image-frame
    initial: on

input_select:
  ghost_meural_effect:
    name: "Ghost Meural Effect"
    options:
      - "random"
      - "spiderwebs"
      - "spiders"
      - "blood"
      - "pentagrams"
      - "apparitions"
    initial: "random"
    icon: mdi:auto-fix

timer:
  ghost_meural_cooldown:
    name: "Ghost Meural Cooldown"
    duration: "00:00:15"
    icon: mdi:timer-sand

script:
  ghost_meural_creepify:
    alias: "Ghost: Meural Creepified Overlay Display"
    description: "Displays an AI-creepified horror overlay of the active Halloween photo on living room Meural Canvas during Ghost Mode WFH."
    mode: restart
    fields:
      effect:
        description: "Horror effect ('spiderwebs', 'spiders', 'blood', 'pentagrams', 'apparitions', 'random')"
        example: "spiderwebs"
        default: "random"
      item_id:
        description: "Optional Meural item ID to display (or 'random' to cycle/randomize)"
        example: "1697904"
        default: "random"
      image_url:
        description: "Optional explicit path or URL to creepified image"
        example: "/local/meural/halloween_creepified/spiderwebs.jpg"
        default: ""
      duration:
        description: "Duration in seconds to display creepified overlay"
        example: 300
        default: 300
      force:
        description: "Bypass safety/WFH gating for testing"
        example: false
        default: false
    sequence:
      # 1. Gate on Ghost Mode, Nesting Parent != Natalia, Thomas WFH, and House Mode Awake
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              is_state('input_boolean.ghost_mode', 'on') and
              states('input_select.nesting_parent') != 'Natalia' and
              is_state('input_boolean.thomas_wfh', 'on') and
              is_state('input_select.mode_house', 'Awake') and
              is_state('input_boolean.ghost_meural', 'on')
            )
          }}

      # 2. Check Meural Canvas availability
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              states('media_player.living_room_mural') not in ['unavailable', 'unknown']
            )
          }}

      # 3. Flush active postcard texture via Halloween gallery ('double-take' normal photo first)
      - service: media_player.select_source
        target:
          entity_id: media_player.living_room_mural
        data:
          source: "Halloween"
      - delay: "00:00:02"
      - service: homeassistant.update_entity
        target:
          entity_id: media_player.living_room_mural

      # 4. Resolve target creepified image URL matching the currently displayed Halloween photo
      - variables:
          effects_list:
            - "spiderwebs"
            - "spiders"
            - "blood"
            - "pentagrams"
            - "apparitions"
          items_list:
            - "1696629"
            - "1696630"
            - "1696632"
            - "1696633"
            - "1697895"
            - "1697896"
            - "1697898"
            - "1697899"
            - "1697900"
            - "1697901"
            - "1697902"
            - "1697903"
            - "1697904"
          current_item_id: >-
            {{ state_attr('media_player.living_room_mural', 'media_content_id') or state_attr('media_player.living_room_mural', 'item_id') or '' }}
          chosen_effect: >-
            {% set req = effect | default('random') %}
            {% set sel = states('input_select.ghost_meural_effect') %}
            {% if req in effects_list %}
              {{ req }}
            {% elif sel in effects_list %}
              {{ sel }}
            {% else %}
              {{ effects_list | random }}
            {% endif %}
          chosen_item: >-
            {% if item_id is defined and item_id and (item_id | string | trim | length > 0) and (item_id | string not in ['unknown', 'unavailable', 'None', 'none', 'random', '""', "''"]) %}
              {{ item_id | string | trim }}
            {% elif current_item_id is defined and current_item_id and (current_item_id | string | trim in items_list) %}
              {{ current_item_id | string | trim }}
            {% else %}
              {{ items_list | random }}
            {% endif %}
          target_url: >-
            {% if image_url is defined and image_url and (image_url | string | trim | length > 0) %}
              {{ image_url }}
            {% else %}
              /local/meural/halloween_creepified/{{ chosen_item }}_{{ chosen_effect }}.jpg
            {% endif %}

      # 5. Morph into the AI-creepified version of that same photo on Meural Canvas
      - service: meural.preview_image
        target:
          entity_id: media_player.living_room_mural
        data:
          content_url: "{{ target_url }}"
          content_type: "image/jpeg"

  ghost_meural_restore:
    alias: "Ghost: Restore Normal Meural Gallery"
    description: "Restores normal Halloween playlist rotation on the living room Meural Canvas."
    mode: single
    sequence:
      - service: media_player.select_source
        target:
          entity_id: media_player.living_room_mural
        data:
          source: "Halloween"

automation:
  - id: halloween_ghost_meural_motion_trigger
    alias: "Halloween Ghost Mode: Meural Creepified Photo Trigger"
    description: "Keeps haunted Meural overlays active across 5-minute gallery rotations, effect changes, and Living Room activity during Ghost Mode WFH."
    mode: restart
    trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: media_player.living_room_mural
        attribute: item_id
      - trigger: state
        entity_id:
          - input_boolean.ghost_mode
          - input_boolean.ghost_meural
        to: "on"
      - trigger: state
        entity_id: input_select.ghost_meural_effect
      - trigger: event
        event_type: zwave_js_value_notification
        event_data:
          node_id: 86
          label: "Scene 001"
          value: "KeyPressed"
    condition:
      - condition: state
        entity_id: input_boolean.ghost_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.ghost_meural
        state: "on"
      - condition: template
        value_template: "{{ states('input_select.nesting_parent') != 'Natalia' }}"
      - condition: state
        entity_id: input_boolean.thomas_wfh
        state: "on"
      - condition: state
        entity_id: input_select.mode_house
        state: "Awake"
      - condition: template
        value_template: "{{ states('timer.ghost_meural_cooldown') in ['idle', 'unknown', 'unavailable'] }}"
    action:
      - delay: "00:00:02"
      - service: timer.start
        target:
          entity_id: timer.ghost_meural_cooldown
      - service: script.ghost_meural_creepify
        data:
          effect: "{{ states('input_select.ghost_meural_effect') | default('random') }}"

  - id: halloween_ghost_meural_restore
    alias: "Halloween Ghost Mode: Meural Restore on Disable"
    description: "Restores standard Meural gallery when Ghost Mode or Possessed Meural Art is turned off."
    trigger:
      - trigger: state
        entity_id:
          - input_boolean.ghost_mode
          - input_boolean.ghost_meural
        to: "off"
    action:
      - service: script.ghost_meural_restore
