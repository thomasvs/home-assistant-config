# Ghost Mode: AI-Creepified Meural Photo Overlays Package
# Provides:
# - input_boolean.ghost_meural (Toggle for Haunted Meural art overlays)
# - input_select.ghost_meural_effect (Effect selector)
# - timer.ghost_meural_cooldown (Short debounce cooldown between Meural overlay pushes)
# - timer.ghost_meural_doorbird_override (1-minute DoorBird doorbell snapshot override timer)
# - script.ghost_meural_creepify (Display item-aware creepified overlay on Meural Canvas)
# - script.ghost_meural_restore (Restore normal Halloween gallery on Meural Canvas)
# - automation.halloween_ghost_meural_motion_trigger (Continuous watchdog & effect trigger)
# - automation.halloween_ghost_meural_restore (Restore normal gallery when Ghost Mode turns off)

input_boolean:
  ghost_meural:
    name: "Possessed Meural Art"
    icon: mdi:image-frame
    initial: on

input_select:
  ghost_meural_effect:
    name: "Ghost Meural Effect"
    options:
      - "random"
      - "spiderwebs"
      - "spiders"
      - "blood"
      - "pentagrams"
      - "apparitions"
    initial: "random"
    icon: mdi:auto-fix

timer:
  ghost_meural_cooldown:
    name: "Ghost Meural Cooldown"
    duration: "00:00:15"
    icon: mdi:timer-sand
  ghost_meural_doorbird_override:
    name: "Ghost Meural Doorbird Override"
    duration: "00:01:00"
    icon: mdi:doorbell

script:
  ghost_meural_creepify:
    alias: "Ghost: Meural Creepified Overlay Display"
    description: "Continuously runs a 2s normal photo -> AI-creepified double-take morph loop on the living room Meural Canvas whenever Ghost Mode is active."
    mode: restart
    fields:
      effect:
        description: "Horror effect ('spiderwebs', 'spiders', 'blood', 'pentagrams', 'apparitions', 'random')"
        example: "spiderwebs"
        default: "random"
      item_id:
        description: "Optional Meural item ID to display (or 'random' to cycle/randomize)"
        example: "1697904"
        default: "random"
      image_url:
        description: "Optional explicit path or URL to creepified image"
        example: "/local/meural/halloween_creepified/spiderwebs.jpg"
        default: ""
      duration:
        description: "Duration in seconds to hold each creepified photo before morphing the next photo"
        example: 30
        default: 30
      iterations:
        description: "Number of morph cycles (0 for continuous loop while enabled)"
        example: 0
        default: 0
      force:
        description: "Bypass safety/WFH gating for testing"
        example: false
        default: false
    sequence:
      # 1. Gate on Ghost Mode, Nesting Parent != Natalia, House not Asleep, and DoorBird idle
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              is_state('input_boolean.ghost_mode', 'on') and
              states('input_select.nesting_parent') != 'Natalia' and
              not is_state('input_select.mode_house', 'Asleep') and
              is_state('input_boolean.ghost_meural', 'on') and
              states('timer.ghost_meural_doorbird_override') in ['idle', 'unknown', 'unavailable', ''] and
              (as_timestamp(now()) - as_timestamp(states('input_datetime.doorbird_last_ring'), 0) >= 60)
            )
          }}

      # 2. Check Meural Canvas is awake and available (do not wake a sleeping frame)
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              states('media_player.living_room_mural') not in ['off', 'unavailable', 'unknown']
            )
          }}

      - variables:
          max_cycles: "{{ iterations | default(0) | int }}"
          hold_seconds: "{{ duration | default(30) | int }}"
      - service: logbook.log
        data:
          name: "Ghost: Meural Haunted Art Creepify"
          message: "Started continuous AI-creepified photo morph loop on Meural Canvas."
          entity_id: script.ghost_meural_creepify
          domain: script

      # 3. Continuous fault-tolerant 'double-take' morph loop across the Halloween gallery
      - repeat:
          while:
            - condition: template
              value_template: >-
                {{
                  states('input_select.nesting_parent') != 'Natalia' and
                  is_state('input_boolean.ghost_meural', 'on') and
                  (force | default(false) or (
                    is_state('input_boolean.ghost_mode', 'on') and
                    not is_state('input_select.mode_house', 'Asleep') and
                    states('media_player.living_room_mural') not in ['off', 'unavailable', 'unknown'] and
                    states('timer.ghost_meural_doorbird_override') in ['idle', 'unknown', 'unavailable', ''] and
                    (as_timestamp(now()) - as_timestamp(states('input_datetime.doorbird_last_ring'), 0) >= 60)
                  )) and
                  (max_cycles == 0 or repeat.index <= max_cycles)
                }}
          sequence:
            # 3a. Switch to Halloween gallery (flushes postcard texture & shows normal photo for 2s)
            - service: media_player.select_source
              continue_on_error: true
              target:
                entity_id: media_player.living_room_mural
              data:
                source: "Halloween"
            - delay: "00:00:02"
            - service: homeassistant.update_entity
              continue_on_error: true
              target:
                entity_id: media_player.living_room_mural

            # 3b. Resolve target creepified image URL matching the currently displayed normal photo
            - variables:
                effects_list:
                  - "spiderwebs"
                  - "spiders"
                  - "blood"
                  - "pentagrams"
                  - "apparitions"
                items_list:
                  - "1696629"
                  - "1696630"
                  - "1696632"
                  - "1696633"
                  - "1697895"
                  - "1697896"
                  - "1697898"
                  - "1697899"
                  - "1697900"
                  - "1697901"
                  - "1697902"
                  - "1697903"
                  - "1697904"
                current_item_id: >-
                  {{ state_attr('media_player.living_room_mural', 'media_content_id') or state_attr('media_player.living_room_mural', 'item_id') or '' }}
                chosen_effect: >-
                  {% set req = effect | default('random') %}
                  {% set sel = states('input_select.ghost_meural_effect') %}
                  {% if req in effects_list %}
                    {{ req }}
                  {% elif sel in effects_list %}
                    {{ sel }}
                  {% else %}
                    {{ effects_list | random }}
                  {% endif %}
                chosen_item: >-
                  {% if item_id is defined and item_id and (item_id | string | trim | length > 0) and (item_id | string not in ['unknown', 'unavailable', 'None', 'none', 'random', '""', "''"]) %}
                    {{ item_id | string | trim }}
                  {% elif current_item_id is defined and current_item_id and (current_item_id | string | trim in items_list) %}
                    {{ current_item_id | string | trim }}
                  {% else %}
                    {{ items_list | random }}
                  {% endif %}
                target_url: >-
                  {% if image_url is defined and image_url and (image_url | string | trim | length > 0) %}
                    {{ image_url }}
                  {% else %}
                    /local/meural/halloween_creepified/{{ chosen_item }}_{{ chosen_effect }}.jpg
                  {% endif %}

            # 3c. Morph into the AI-creepified version of that exact same photo (if frame still awake)
            - if:
                - condition: template
                  value_template: >-
                    {{
                      force | default(false) or (
                        is_state('input_boolean.ghost_mode', 'on') and
                        is_state('input_boolean.ghost_meural', 'on') and
                        not is_state('input_select.mode_house', 'Asleep') and
                        states('media_player.living_room_mural') not in ['off', 'unavailable', 'unknown']
                      )
                    }}
              then:
                - service: meural.preview_image
                  continue_on_error: true
                  target:
                    entity_id: media_player.living_room_mural
                  data:
                    content_url: "{{ target_url }}"
                    content_type: "image/jpeg"

            # 3d. Hold creepy photo before cycling to the next photo (if continuing loop)
            - if:
                - condition: template
                  value_template: "{{ max_cycles == 0 or repeat.index < max_cycles }}"
              then:
                - delay:
                    seconds: "{{ hold_seconds }}"

  ghost_meural_restore:
    alias: "Ghost: Restore Normal Meural Gallery"
    description: "Restores normal playlist rotation on the living room Meural Canvas."
    mode: single
    sequence:
      - service: logbook.log
        data:
          name: "Ghost: Meural Gallery Restore"
          message: "Restored standard gallery on Meural Canvas."
          entity_id: script.ghost_meural_restore
          domain: script
      - if:
          - condition: template
            value_template: "{{ states('media_player.living_room_mural') not in ['off', 'unavailable', 'unknown'] }}"
        then:
          - service: media_player.select_source
            continue_on_error: true
            target:
              entity_id: media_player.living_room_mural
            data:
              source: >-
                {{ 'Halloween' if is_state('input_select.mode_seasonal', 'Halloween') else 'Display Portrait' }}

automation:
  - id: halloween_ghost_meural_motion_trigger
    alias: "Halloween Ghost Mode: Meural Creepified Photo Trigger"
    description: "Continuously ensures the AI-creepified Meural morph loop stays running whenever Ghost Mode and Possessed Meural Art are active, without interrupting healthy cycles."
    mode: single
    max_exceeded: silent
    trigger:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
      - trigger: state
        entity_id:
          - input_boolean.ghost_mode
          - input_boolean.ghost_meural
        to: "on"
      - trigger: state
        entity_id: input_select.nesting_parent
        to: "Thomas"
      - trigger: state
        entity_id: input_select.mode_house
        from: "Asleep"
      - trigger: state
        entity_id: media_player.living_room_mural
        from:
          - "off"
          - "unavailable"
          - "unknown"
      - trigger: state
        id: restart_loop
        entity_id: input_select.ghost_meural_effect
      - trigger: event
        id: restart_loop
        event_type: zwave_js_value_notification
        event_data:
          node_id: 86
          label: "Scene 001"
          value: "KeyPressed"
    condition:
      - condition: state
        entity_id: input_boolean.ghost_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.ghost_meural
        state: "on"
      - condition: template
        value_template: "{{ states('input_select.nesting_parent') != 'Natalia' }}"
      - condition: template
        value_template: "{{ not is_state('input_select.mode_house', 'Asleep') }}"
      - condition: template
        value_template: "{{ states('media_player.living_room_mural') not in ['off', 'unavailable', 'unknown'] }}"
      - condition: template
        value_template: "{{ trigger.id == 'restart_loop' or is_state('script.ghost_meural_creepify', 'off') }}"
      - condition: template
        value_template: >-
          {{
            states('timer.ghost_meural_doorbird_override') in ['idle', 'unknown', 'unavailable', ''] and
            (as_timestamp(now()) - as_timestamp(states('input_datetime.doorbird_last_ring'), 0) >= 60)
          }}
    action:
      - service: script.turn_on
        target:
          entity_id: script.ghost_meural_creepify
        data:
          variables:
            effect: "{{ states('input_select.ghost_meural_effect') | default('random') }}"

  - id: halloween_ghost_meural_restore
    alias: "Halloween Ghost Mode: Meural Restore on Disable"
    description: "Restores standard Meural gallery when Ghost Mode or Possessed Meural Art is turned off, or when House enters Asleep mode."
    trigger:
      - trigger: state
        entity_id:
          - input_boolean.ghost_mode
          - input_boolean.ghost_meural
        to: "off"
      - trigger: state
        entity_id: input_select.mode_house
        to: "Asleep"
    action:
      - service: script.turn_off
        target:
          entity_id: script.ghost_meural_creepify
      - service: script.ghost_meural_restore

  - id: halloween_ghost_meural_doorbird_override_start
    alias: "Halloween Ghost Mode: Meural DoorBird Override Start"
    description: "Immediately stops creepify script and starts 1-minute override timer when DoorBird doorbell rings."
    mode: restart
    trigger:
      - trigger: event
        event_type: doorbird_doorbird_entry_doorbell
      - trigger: state
        entity_id: event.doorbird_entry_doorbell
    action:
      - service: timer.start
        target:
          entity_id: timer.ghost_meural_doorbird_override
        data:
          duration: "00:01:00"
      - service: script.turn_off
        target:
          entity_id: script.ghost_meural_creepify

  - id: halloween_ghost_meural_doorbird_override_end
    alias: "Halloween Ghost Mode: Meural Resume After DoorBird Override"
    description: "Resumes AI-creepified photo mode if Ghost Mode is active or restores normal gallery after 1-minute DoorBird doorbell snapshot expires."
    mode: restart
    trigger:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.ghost_meural_doorbird_override
    action:
      - if:
          - condition: state
            entity_id: input_boolean.ghost_mode
            state: "on"
          - condition: state
            entity_id: input_boolean.ghost_meural
            state: "on"
          - condition: template
            value_template: "{{ states('input_select.nesting_parent') != 'Natalia' }}"
          - condition: template
            value_template: "{{ not is_state('input_select.mode_house', 'Asleep') }}"
          - condition: template
            value_template: "{{ states('media_player.living_room_mural') not in ['off', 'unavailable', 'unknown'] }}"
        then:
          - service: script.turn_on
            target:
              entity_id: script.ghost_meural_creepify
            data:
              variables:
                effect: "{{ states('input_select.ghost_meural_effect') | default('random') }}"
        else:
          - service: script.ghost_meural_restore
