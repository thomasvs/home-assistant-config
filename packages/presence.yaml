# Presence detection package for Thomas and Natalia (pers-ha.49)
# Provides:
# - binary_sensor.thomas_presence: Multi-source composite presence with 5m off-delay
# - binary_sensor.natalia_presence: Multi-source composite presence with 5m off-delay
# - binary_sensor.thomas_presence_bayesian: Probabilistic sensor fusion
# - binary_sensor.natalia_presence_bayesian: Probabilistic sensor fusion

template:
  - binary_sensor:
      - name: "Thomas Presence"
        unique_id: thomas_presence
        device_class: presence
        state: >-
          {{ is_state('person.thomas', 'home')
             or is_state('device_tracker.pixel_10_pro_fold', 'home')
             or is_state('device_tracker.pixel_10_pro_fold_3', 'home')
             or is_state('device_tracker.pixel_10_pro_fold_4', 'home')
             or (states('sensor.pixel_10_pro_fold_wi_fi_connection') | lower == 'amantes') }}
        delay_off:
          minutes: 5
        attributes:
          source_person: "{{ states('person.thomas') }}"
          source_mobile_gps: "{{ states('device_tracker.pixel_10_pro_fold') }}"
          source_unifi_1: "{{ states('device_tracker.pixel_10_pro_fold_3') }}"
          source_unifi_2: "{{ states('device_tracker.pixel_10_pro_fold_4') }}"
          source_wifi_state: "{{ states('binary_sensor.pixel_10_pro_fold_wi_fi_state') }}"
          source_wifi_ssid: "{{ states('sensor.pixel_10_pro_fold_wi_fi_connection') }}"

      - name: "Natalia Presence"
        unique_id: natalia_presence
        device_class: presence
        state: >-
          {{ is_state('person.natalia', 'home')
             or is_state('device_tracker.iphone_8', 'home')
             or (is_state('device_tracker.natalia_s_phone', 'home')
                 and not is_state('sensor.natalia_s_phone_location_permission', 'Denied'))
             or (states('sensor.natalia_s_phone_ssid') | lower == 'amantes') }}
        delay_off:
          minutes: 5
        attributes:
          source_person: "{{ states('person.natalia') }}"
          source_unifi: "{{ states('device_tracker.iphone_8') }}"
          source_mobile_gps: "{{ states('device_tracker.natalia_s_phone') }}"
          source_location_permission: "{{ states('sensor.natalia_s_phone_location_permission') }}"
          source_wifi_ssid: "{{ states('sensor.natalia_s_phone_ssid') }}"

      - name: "Patrick Presence"
        unique_id: patrick_presence
        device_class: presence
        state: >-
          {{ is_state('person.patrick', 'home')
             or is_state('device_tracker.iphone_12', 'home') }}
        delay_off:
          minutes: 5
        attributes:
          source_person: "{{ states('person.patrick') }}"
          source_unifi: "{{ states('device_tracker.iphone_12') }}"
          mac_address: "ae:9e:3a:2d:4d:f0"

binary_sensor:
  - platform: bayesian
    name: "Thomas Presence Bayesian"
    unique_id: thomas_presence_bayesian
    device_class: presence
    prior: 0.50
    probability_threshold: 0.85
    observations:
      - platform: state
        entity_id: device_tracker.pixel_10_pro_fold
        to_state: "home"
        prob_given_true: 0.95
        prob_given_false: 0.05
      - platform: state
        entity_id: device_tracker.pixel_10_pro_fold_3
        to_state: "home"
        prob_given_true: 0.90
        prob_given_false: 0.02
      - platform: state
        entity_id: sensor.pixel_10_pro_fold_wi_fi_connection
        to_state: "amantes"
        prob_given_true: 0.99
        prob_given_false: 0.01

  - platform: bayesian
    name: "Natalia Presence Bayesian"
    unique_id: natalia_presence_bayesian
    device_class: presence
    prior: 0.50
    probability_threshold: 0.85
    observations:
      - platform: state
        entity_id: device_tracker.iphone_8
        to_state: "home"
        prob_given_true: 0.95
        prob_given_false: 0.05

  - platform: bayesian
    name: "Patrick Presence Bayesian"
    unique_id: patrick_presence_bayesian
    device_class: presence
    prior: 0.10
    probability_threshold: 0.85
    observations:
      - platform: state
        entity_id: device_tracker.iphone_12
        to_state: "home"
        prob_given_true: 0.95
        prob_given_false: 0.05
