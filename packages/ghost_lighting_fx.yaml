# Ghost Mode: Candlelight Flickering & Synchronized Thunder/Lightning Simulation Package
# Provides:
# - input_boolean.ghost_candle_flicker (Toggle for amber candlelight flicker)
# - timer.ghost_lightning_cooldown (15-min refractory cooldown between lightning strikes)
# - script.ghost_lightning_strike (Window light staccato strobe, sound delay, rolling thunder)
# - script.ghost_candle_flicker_room (Subtle ~2000K warm candle flicker with smooth brightness random walk)
# - script.ghost_candle_flicker_restore (Clean restoration to normal 3000K white profile)
# - script.ghost_candle_flicker_all (Orchestrate flicker across kitchen, hallway, and windows)
# - script.ghost_emergency_reset (Global disarm: stop loops, reset switches, restore normal white lights)
# - automation.halloween_ghost_lightning_ambient (Occasional ambient lightning when idle)
# - automation.halloween_ghost_candle_flicker_sync (Auto-start/stop flicker when lights turn on/off in Ghost Mode)

input_boolean:
  ghost_candle_flicker:
    name: "Ghost Candle Flicker"
    icon: mdi:candle
    initial: on

timer:
  ghost_lightning_cooldown:
    name: "Ghost Lightning Cooldown"
    duration: "00:15:00"
    icon: mdi:timer-sand

script:
  ghost_lightning_strike:
    alias: "Ghost: Lightning Strike & Synchronized Thunder"
    description: "Abrupt blackout, 2-4 rapid staccato cold-white lightning bursts on window lights with zero state drift, speed-of-sound delay, and deep rolling thunder audio on idle Cast speaker."
    mode: restart
    fields:
      target_lights:
        description: "List of window lights to strobe"
        example: "['light.window_north', 'light.window_northest', 'light.window_south', 'light.window_southest']"
      force:
        description: "Bypass safety/WFH/idle gating (for manual testing/triggering)"
        example: "false"
        default: false
      sound_enabled:
        description: "Whether to play rolling thunder audio"
        example: "true"
        default: true
      sound_track:
        description: "Thunder sound track URL"
        default: "/local/sounds/halloween/thunder_deep.mp3"
    sequence:
      # 1. Gate on Ghost Mode, Nesting Parent != Natalia, Thomas WFH, and House Mode Awake
      - condition: template
        value_template: >-
          {{
            force | default(false) or (
              is_state('input_boolean.ghost_mode', 'on') and
              states('input_select.nesting_parent') != 'Natalia' and
              is_state('input_boolean.thomas_wfh', 'on') and
              is_state('input_select.mode_house', 'Awake')
            )
          }}

      # 2. Resolve target window lights
      - variables:
          resolved_lights: >-
            {{
              target_lights | default([
                'light.window_north',
                'light.window_northest',
                'light.window_south',
                'light.window_southest'
              ])
            }}
      - service: logbook.log
        data:
          name: "Ghost: Lightning Strike & Thunder"
          message: "Triggered synchronized lightning strike on window lights with thunder audio."
          entity_id: script.ghost_lightning_strike
          domain: script

      # 3. Snapshot initial states before strike to guarantee zero state drift
      - service: scene.create
        data:
          scene_id: ghost_before_lightning
          snapshot_entities: "{{ resolved_lights }}"

      # 4. Abrupt blackout
      - service: light.turn_off
        target:
          entity_id: "{{ resolved_lights }}"
        data:
          transition: 0.1
      - delay:
          milliseconds: 150

      # 5. Multi-flash staccato (2 to 4 rapid cold-white strikes)
      - repeat:
          count: "{{ range(2, 5) | random }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ resolved_lights }}"
              data:
                rgb_color: [225, 240, 255]
                brightness: "{{ range(200, 255) | random }}"
                transition: 0
            - delay:
                milliseconds: "{{ range(40, 160) | random }}"
            - service: light.turn_on
              target:
                entity_id: "{{ resolved_lights }}"
              data:
                brightness: "{{ range(10, 40) | random }}"
                transition: 0
            - delay:
                milliseconds: "{{ range(60, 220) | random }}"

      # 6. Final blinding flash & cut to black
      - service: light.turn_on
        target:
          entity_id: "{{ resolved_lights }}"
        data:
          rgb_color: [255, 255, 255]
          brightness: 255
          transition: 0
      - delay:
          milliseconds: 100
      - service: light.turn_off
        target:
          entity_id: "{{ resolved_lights }}"

      # 7. Restore original pre-strike light states (guaranteeing no state drift)
      - service: scene.turn_on
        target:
          entity_id: scene.ghost_before_lightning
      - if:
          - condition: template
            value_template: >-
              {{
                is_state('input_boolean.ghost_mode', 'on') and
                is_state('input_boolean.ghost_candle_flicker', 'on') and
                states('input_select.nesting_parent') != 'Natalia' and
                is_state('input_select.mode_house', 'Awake')
              }}
        then:
          - service: script.turn_on
            target:
              entity_id: script.ghost_candle_flicker_all

      # 8. Realistic speed-of-sound delay before thunderclap (1.2s - 2.8s)
      - delay:
          milliseconds: "{{ range(1200, 2800) | random }}"

      # 9. Play deep rolling thunder audio on idle living room / Cast speaker
      - if:
          - condition: template
            value_template: "{{ sound_enabled | default(true) }}"
        then:
          - variables:
              eligible_speakers: >-
                {{
                  [
                    'media_player.living_room_tv_cast_cast',
                    'media_player.pixel_tablet',
                    'media_player.balcony_display'
                  ] | select('is_state', ['off', 'idle', 'paused']) | list
                }}
          - if:
              - condition: template
                value_template: "{{ eligible_speakers | length > 0 or (force | default(false)) }}"
            then:
              - variables:
                  target_spk: >-
                    {% if 'media_player.balcony_display' in eligible_speakers %}
                      media_player.balcony_display
                    {% elif 'media_player.pixel_tablet' in eligible_speakers %}
                      media_player.pixel_tablet
                    {% elif eligible_speakers | length > 0 %}
                      {{ eligible_speakers | first }}
                    {% else %}
                      media_player.balcony_display
                    {% endif %}
                  resolved_thunder_track: >-
                    {% set st = sound_track | default('/local/sounds/halloween/thunder_deep.mp3') %}
                    {% if st in ['thunder_deep', 'thunder', '/local/sounds/halloween/thunder_deep.mp3'] %}
                      /local/sounds/halloween/thunder_deep_{{ range(1, 5) | random }}.mp3
                    {% else %}
                      {{ st }}
                    {% endif %}
              - service: script.cast_play_media_silent_wake
                continue_on_error: true
                data:
                  entity_id: "{{ target_spk }}"
                  media_content_id: "{{ resolved_thunder_track }}"
                  media_content_type: "audio/mp3"
                  volume_level: 0.70

  ghost_candle_flicker_room:
    alias: "Ghost: Candle Flame Flicker"
    description: "Subtle warm candlelight flicker (steady ~2000K, smooth brightness random walk 68-86, matched 0.7-1.4s transitions) across target light, cleanly restoring normal white profile when stopped."
    mode: parallel
    max: 12
    fields:
      light_entity:
        description: "Target light or group to flicker"
        example: "light.kitchen_lights"
        default: "light.kitchen_lights"
      iterations:
        description: "Number of flicker cycles (0 for infinite while ghost_mode is on)"
        example: "0"
        default: 0
      restore_normal:
        description: "Restore normal white light profile when stopped"
        example: "true"
        default: true
    sequence:
      - variables:
          target: "{{ light_entity | default('light.kitchen_lights') }}"
          max_cycles: "{{ iterations | default(0) | int }}"
      - service: logbook.log
        data:
          name: "Ghost: Candle Flame Flicker"
          message: "Started warm candlelight flame flicker on {{ target }}."
          entity_id: script.ghost_candle_flicker_room
          domain: script
      # 1. Softly ease into baseline warm candle glow (2000K, brightness 76) before subtle ripple loop
      - if:
          - condition: template
            value_template: >-
              {{
                is_state('input_boolean.ghost_mode', 'on') and
                is_state('input_boolean.ghost_candle_flicker', 'on') and
                states('input_select.nesting_parent') != 'Natalia' and
                is_state('input_select.mode_house', 'Awake') and
                is_state(target, 'on')
              }}
        then:
          - service: light.turn_on
            target:
              entity_id: "{{ target }}"
            data:
              color_temp_kelvin: 2000
              brightness: 76
              transition: 1.2
          - delay:
              milliseconds: 1200
      # 2. Subtle bounded random walk around 2000K (1985-2015K) and brightness 76 (68-86)
      - repeat:
          while:
            - condition: template
              value_template: >-
                {{
                  is_state('input_boolean.ghost_mode', 'on') and
                  is_state('input_boolean.ghost_candle_flicker', 'on') and
                  states('input_select.nesting_parent') != 'Natalia' and
                  is_state('input_select.mode_house', 'Awake') and
                  is_state(target, 'on') and
                  (max_cycles == 0 or repeat.index <= max_cycles)
                }}
          sequence:
            - variables:
                step_ms: "{{ range(700, 1401) | random }}"
                cur_bri: "{{ [68, [86, state_attr(target, 'brightness') | int(76)] | min] | max }}"
                delta_bri: "{{ range(-6, 7) | random }}"
            - variables:
                step_sec: "{{ ((step_ms | int) / 1000) | round(2) }}"
                next_bri: "{{ [68, [86, (cur_bri | int) + (delta_bri | int)] | min] | max }}"
                next_kelvin: "{{ (1985 + (([68, [86, (cur_bri | int) + (delta_bri | int)] | min] | max) - 68) * 30 / 18) | round(0) | int }}"
            - service: light.turn_on
              target:
                entity_id: "{{ target }}"
              data:
                color_temp_kelvin: "{{ next_kelvin }}"
                brightness: "{{ next_bri }}"
                transition: "{{ step_sec }}"
            - delay:
                milliseconds: "{{ step_ms }}"
      # 3. When repeat finishes or condition breaks, restore normal white illumination
      - if:
          - condition: template
            value_template: "{{ restore_normal | default(true) and is_state(target, 'on') }}"
        then:
          - service: light.turn_on
            target:
              entity_id: "{{ target }}"
            data:
              color_temp_kelvin: 3000
              brightness: 255
              transition: 1.0

  ghost_candle_flicker_restore:
    alias: "Ghost: Restore Normal White Profile"
    description: "Restores normal 3000K white profile and 100% brightness across currently turned-on target lights."
    mode: restart
    fields:
      light_entity:
        description: "Target light entity or list"
        example: "light.kitchen_lights"
        default: "light.kitchen_lights"
    sequence:
      - variables:
          raw_targets: >-
            {% set le = light_entity | default([
              'light.kitchen_lights',
              'light.hallway',
              'light.window_southest',
              'light.window_south',
              'light.window_north',
              'light.window_northest'
            ]) %}
            {{ [le] if le is string else le }}
          targets: "{{ raw_targets | select('is_state', 'on') | list }}"
      - service: logbook.log
        data:
          name: "Ghost: Candle Flame Flicker Restore"
          message: "Restored normal soft white lighting profile on {{ targets }}."
          entity_id: script.ghost_candle_flicker_restore
          domain: script
      - if:
          - condition: template
            value_template: "{{ targets | length > 0 }}"
        then:
          - service: light.turn_on
            target:
              entity_id: "{{ targets }}"
            data:
              color_temp_kelvin: 3000
              brightness: 255
              transition: 1.0

  ghost_candle_flicker_all:
    alias: "Ghost: Start Candle Flicker All Active"
    description: "Launches independent candlelight flicker on kitchen, hallway, and each of the 4 living room window lights that are currently turned on."
    mode: restart
    sequence:
      - service: logbook.log
        data:
          name: "Ghost: Candle Flame Flicker All"
          message: "Triggered independent candlelight flicker orchestration across all active light fixtures."
          entity_id: script.ghost_candle_flicker_all
          domain: script
      - repeat:
          for_each:
            - light.kitchen_lights
            - light.hallway
            - light.window_southest
            - light.window_south
            - light.window_north
            - light.window_northest
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state(repeat.item, 'on') }}"
              then:
                - service: script.turn_on
                  target:
                    entity_id: script.ghost_candle_flicker_room
                  data:
                    variables:
                      light_entity: "{{ repeat.item }}"
                      iterations: 0
                      restore_normal: true
                - delay:
                    milliseconds: 150

  ghost_emergency_reset:
    alias: "Ghost: Emergency Reset & Disarm All"
    description: "One-touch disarm: stops all ghost scripts, restores HomeSeer switch LEDs, restores lights to normal 3000K white, turns off ghost mode, and stops media playback."
    mode: restart
    sequence:
      - service: logbook.log
        data:
          name: "Ghost Mode Safety Interlock"
          message: "EMERGENCY RESET TRIGGERED: Disarming all ghost automations, stopping scripts, and restoring normal illumination."
          entity_id: script.ghost_emergency_reset
          domain: script
      - service: script.turn_off
        target:
          entity_id:
            - script.ghost_lightning_strike
            - script.ghost_candle_flicker_room
            - script.ghost_candle_flicker_all
            - script.ghost_phantom_footsteps
            - script.ghost_tv_poltergeist
            - script.ghost_homeseer_heartbeat
            - script.ghost_homeseer_cylon_sweep
            - script.ghost_homeseer_cylon
            - script.ghost_meural_creepify
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ghost_mode
            - input_boolean.ghost_candle_flicker
            - input_boolean.ghost_tv_interruption
            - input_boolean.ghost_homeseer_leds
      - service: script.ghost_homeseer_restore
        continue_on_error: true
      - service: script.ghost_meural_restore
        continue_on_error: true
      - service: light.turn_on
        target:
          entity_id:
            - light.kitchen_lights
            - light.hallway
            - light.window_north
            - light.window_northest
            - light.window_south
            - light.window_southest
        data:
          color_temp_kelvin: 3000
          brightness: 255
          transition: 0.5
      - service: media_player.media_stop
        target:
          entity_id:
            - media_player.living_room_tv_cast_cast
            - media_player.pixel_tablet
            - media_player.balcony_display

automation:
  - id: halloween_ghost_lightning_ambient
    alias: "Halloween Ghost Mode: Ambient Window Lightning"
    description: "Randomly triggers lightning & thunder outside windows during Ghost Mode WFH when cooldown has elapsed."
    trigger:
      - trigger: time_pattern
        minutes: "/20"
    condition:
      - condition: state
        entity_id: input_boolean.ghost_mode
        state: "on"
      - condition: template
        value_template: "{{ states('input_select.nesting_parent') != 'Natalia' }}"
      - condition: state
        entity_id: input_boolean.thomas_wfh
        state: "on"
      - condition: state
        entity_id: input_select.mode_house
        state: "Awake"
      - condition: state
        entity_id: timer.ghost_lightning_cooldown
        state: "idle"
    action:
      - service: timer.start
        target:
          entity_id: timer.ghost_lightning_cooldown
      - service: script.ghost_lightning_strike
        data:
          force: false
          sound_enabled: true

  - id: halloween_ghost_candle_flicker_sync
    alias: "Halloween Ghost Mode: Candle Flicker Auto-Sync"
    description: "Automatically starts independent candlelight flicker when kitchen, hallway, or any of the 4 living room window lights turn on, or when Ghost Mode/Candle Flicker/Awake mode turns on."
    mode: parallel
    max: 12
    trigger:
      - trigger: state
        id: light_turned_on
        entity_id:
          - light.kitchen_lights
          - light.hallway
          - light.window_southest
          - light.window_south
          - light.window_north
          - light.window_northest
        to: "on"
      - trigger: state
        id: mode_enabled
        entity_id:
          - input_boolean.ghost_mode
          - input_boolean.ghost_candle_flicker
        to: "on"
      - trigger: state
        id: mode_enabled
        entity_id: input_select.mode_house
        to: "Awake"
    condition:
      - condition: state
        entity_id: input_boolean.ghost_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.ghost_candle_flicker
        state: "on"
      - condition: template
        value_template: "{{ states('input_select.nesting_parent') != 'Natalia' }}"
      - condition: state
        entity_id: input_select.mode_house
        state: "Awake"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: light_turned_on
            sequence:
              - service: script.turn_on
                target:
                  entity_id: script.ghost_candle_flicker_room
                data:
                  variables:
                    light_entity: "{{ trigger.entity_id }}"
                    iterations: 0
                    restore_normal: true
          - conditions:
              - condition: trigger
                id: mode_enabled
            sequence:
              - service: script.turn_on
                target:
                  entity_id: script.ghost_candle_flicker_all
