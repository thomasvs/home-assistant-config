halloween_laugh_kitchen:
  sequence:
  - service: media_player.play_media
    data_template:
      entity_id: media_player.pixel_tablet
      media_content_id: !secret mp3_halloween_laugh
      media_content_type: 'audio/mp3'

halloween_creak_kitchen:
  sequence:
  - service: media_player.play_media
    data_template:
      entity_id: media_player.pixel_tablet
      media_content_id: !secret mp3_halloween_creak
      media_content_type: 'audio/mp3'
  - service: light.lifx_effect_pulse
    data_template:
      entity_id: light.kitchen_north
      mode: breathe
      period: 5
      cycles: 5

halloween_laugh_guest_bedroom:
  sequence:
  - service: media_player.play_media
    data_template:
      entity_id: media_player.guest_bedroom
      media_content_id: !secret mp3_halloween_laugh
      media_content_type: 'audio/mp3'

halloween_creak_guest_bedroom:
  sequence:
  - service: media_player.play_media
    data_template:
      entity_id: media_player.guest_bedroom
      media_content_id: !secret mp3_halloween_creak
      media_content_type: 'audio/mp3'

halloween_laugh_guest_bathroom:
  sequence:
  - if:
      - condition: state
        entity_id: media_player.guest_bathroom
        state: 'off'
    then:
      - service: media_player.volume_mute
        target:
          entity_id: media_player.guest_bathroom
        data:
          is_volume_muted: true
      - service: media_player.turn_on
        target:
          entity_id: media_player.guest_bathroom
      - delay:
          milliseconds: 900
      - service: media_player.volume_mute
        target:
          entity_id: media_player.guest_bathroom
        data:
          is_volume_muted: false
  - service: media_player.play_media
    data_template:
      entity_id: media_player.guest_bathroom
      media_content_id: !secret mp3_halloween_laugh
      media_content_type: 'audio/mp3'

halloween_creak_guest_bathroom:
  sequence:
  - if:
      - condition: state
        entity_id: media_player.guest_bathroom
        state: 'off'
    then:
      - service: media_player.volume_mute
        target:
          entity_id: media_player.guest_bathroom
        data:
          is_volume_muted: true
      - service: media_player.turn_on
        target:
          entity_id: media_player.guest_bathroom
      - delay:
          milliseconds: 900
      - service: media_player.volume_mute
        target:
          entity_id: media_player.guest_bathroom
        data:
          is_volume_muted: false
  - service: media_player.play_media
    data_template:
      entity_id: media_player.guest_bathroom
      media_content_id: !secret mp3_halloween_creak
      media_content_type: 'audio/mp3'

