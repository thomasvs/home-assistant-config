keymaster_front_door_manual_notify:
  mode: parallel
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ ('unlocked' in (message | default('') | lower) or 'open' in (message | default('') | lower)) or (is_state('lock.lock_front_door', 'unlocked') and 'locked' not in (message | default('') | lower)) }}"
          sequence:
            - service: notify.mobile_app_pixel_10_pro_fold
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  group: Front Door
                  tag: front-door
                  actions:
                    - action: "LOCK"
                      title: Lock Front Door
                      icon: "sfsymbols.lock"
            - service: notify.mobile_app_sm_t976n
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  group: Front Door
                  tag: front-door
                  actions:
                    - action: "LOCK"
                      title: Lock Front Door
                      icon: "sfsymbols.lock"
        - conditions:
            - condition: template
              value_template: "{{ ('locked' in (message | default('') | lower) and 'unlocked' not in (message | default('') | lower)) or 'closed' in (message | default('') | lower) or (is_state('lock.lock_front_door', 'locked') and 'unlocked' not in (message | default('') | lower) and 'open' not in (message | default('') | lower)) }}"
          sequence:
            - service: notify.mobile_app_pixel_10_pro_fold
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  group: Front Door
                  tag: front-door
                  actions:
                    - action: "UNLOCK"
                      title: Unlock Front Door
                      icon: "sfsymbols.lock.open"
            - service: notify.mobile_app_sm_t976n
              data:
                title: "{{ title }}"
                message: "{{ message }}"
                data:
                  group: Front Door
                  tag: front-door
                  actions:
                    - action: "UNLOCK"
                      title: Unlock Front Door
                      icon: "sfsymbols.lock.open"
      default:
        - service: notify.mobile_app_pixel_10_pro_fold
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data:
              group: Front Door
              tag: front-door
        - service: notify.mobile_app_sm_t976n
          data:
            title: "{{ title }}"
            message: "{{ message }}"
            data:
              group: Front Door
              tag: front-door
