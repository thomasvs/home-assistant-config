spotify_select_samsung_tv:
  icon: "mdi:television"
  description: "Switch to spotify on Samsung TV"
  fields:
    entity_id:
      description: "The entity id of the Samsung TV"
      example: "media_player.samsung_tv"
  sequence:
  - if:
    - alias: "If TV is powered off"
      condition: state
      entity_id: switch.power_tv
      state: "off"
    then:
    - alias: "Turn on the TV"
      service: switch.turn_on
      data:
        entity_id: switch.power_tv
    - alias: "and wait ten seconds to select spotify"
      delay: 10
  # sometimes on restart switch.power_tv reports on erroneously
  - service: switch.turn_on
    data:
      entity_id: switch.power_tv
  - service: media_player.turn_on
    data:
      entity_id: media_player.samsung_tv
  - service: media_player.turn_on
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
      source: "Spotify - Music and Podcasts"
  - service: media_player.media_play
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
  - service: media_player.volume_set
    data:
      volume_level: 0.56
    target:
      # device_id: 7b1d7bc5723a29396da3669f5645efa7 # Onkyo
      entity_id: media_player.tx_nr809


spotify_smart_play:
  alias: "Spotify Smart Play"
  icon: "mdi:brain"
  description: "Dynamic routing for Spotify playlists"
  mode: single
  fields:
    trigger_source:
      description: "The source that triggered this playback"
      example: "home_streamdeck"
    override_playlist:
      description: "Optional manual override playlist"
      example: "Flow"
    override_device:
      description: "Optional manual override destination"
      example: "Living Room TV"
  sequence:
    # 1. Capture the current inputs into variables first
    - variables:
        input_playlist: "{{ override_playlist | default('Automatic') }}"
        input_device: "{{ override_device | default('Automatic') }}"

    # 2. Immediately reset both UI dropdowns back to Automatic
    - service: input_select.select_option
      target:
        entity_id: input_select.spotify_playlist_selector
      data:
        option: "Automatic"
    - service: input_select.select_option
      target:
        entity_id: input_select.spotify_target_device
      data:
        option: "Automatic"

    # 3. Resolve Target Speaker
    - variables:
        # Resolve destination
        resolved_device: >-
          {% if input_device not in ['Automatic', ''] %}
            {{ input_device }}
          {% else %}
            {{ 'Living Room TV' if trigger_source == 'home_streamdeck' else none }}
          {% endif %}
          
        # Map resolved friendly device name to actual media player entity and Spotify Connect string
        target_entity: >-
          {% if resolved_device == 'Living Room TV' %}
            none
          {% elif resolved_device == 'Living Room Google TV' %}
            media_player.living_room_tv_cast_cast
          {% elif resolved_device == 'Main Bedroom' %}
            media_player.main_bedroom
          {% elif resolved_device == 'Main Bathroom' %}
            media_player.main_bathroom
          {% elif resolved_device == 'Guest Bathroom' %}
            media_player.guest_bathroom
          {% elif resolved_device == 'Guest Bedroom' %}
            media_player.guest_bedroom
          {% else %}
            none
          {% endif %}

        target_device: >-
          {% if resolved_device == 'Living Room TV' %}
            Samsung TV QN65Q90RAFXZA
          {% elif resolved_device == 'Work Desktop' %}
            thomasvsd3.nyc.corp.google.com
          {% else %}
            none
          {% endif %}
        
        # 4. Determine Playlist (MVP Version)
        selected_playlist: >-
          {% if input_playlist not in ['Automatic', ''] %}
            {{ input_playlist | lower | replace(' ', '_') }}
          {% else %}
            {% set current_day = now().strftime('%w') | int %}
            {% if current_day == 1 %}
              discover_weekly
            {% elif current_day == 5 %}
              flow
            {% elif current_day == 6 %}
              release_radar
            {% else %}
              this_quarter
            {% endif %}
          {% endif %}

    # 5. Trigger Playback
    - service: script.spotify_play_playlist
      data:
        entity_id: "{{ target_entity }}"
        device_name: "{{ target_device }}"
        playlist_name: "{{ selected_playlist }}"
