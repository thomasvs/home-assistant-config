    wait_template: "{{ is_state_attr('remote.living_room_google_tv_remote', 'current_activity', 'com.spotify.tv.android') }}"
    timeout: "00:00:04"
  - delay: 1


spotify_smart_play:
  alias: "Spotify Smart Play"
  icon: "mdi:brain"
  description: "Dynamic routing for Spotify playlists"
  mode: single
  fields:
    trigger_source:
      description: "The source that triggered this playback"
      example: "home_streamdeck"
    override_playlist:
      description: "Optional manual override playlist"
      example: "Flow"
    override_device:
      description: "Optional manual override destination"
      example: "Living Room TV"
  sequence:
    # 0. Log the incoming raw parameters immediately
    - service: system_log.write
      data:
        message: >-
          Spotify Smart Play [INFO] - Received request: Source: {{ trigger_source | default('none') }}, Override Playlist: {{ override_playlist | default('none') }}, Override Device: {{ override_device | default('none') }}
        level: info
        logger: custom_scripts.spotify_smart_play

    # 1. Capture variables from input parameters or fallback to helper states directly
    - variables:
        input_playlist: >-
          {%- if override_playlist is defined and override_playlist != '' and override_playlist != none and 'states(' not in override_playlist -%}
            {{ override_playlist | trim }}
          {%- else -%}
            {{ states('input_select.spotify_playlist_selector') | trim }}
          {%- endif -%}
        input_device: >-
          {%- if override_device is defined and override_device != '' and override_device != none and 'states(' not in override_device -%}
            {{ override_device | trim }}
          {%- else -%}
            {{ states('input_select.spotify_target_device') | trim }}
          {%- endif -%}

    # 3. Reset UI dropdowns back to default states
    - service: input_select.select_option
      target:
        entity_id:
          - input_select.spotify_playlist_selector
      data:
        option: "Current"
    - service: input_select.select_option
      target:
        entity_id:
          - input_select.spotify_target_device
      data:
        option: "Current"

    # 4. Resolve Target Speaker
    - variables:
        active_playing_entity: >-
          {%- if is_state('media_player.spotify_thomas_vander_stichele', 'playing') -%}
            media_player.spotify_thomas_vander_stichele
          {%- elif states('media_player.unnamed_room') == 'playing' -%}
            media_player.unnamed_room
          {%- elif is_state('media_player.main_bedroom', 'playing') -%}
            media_player.main_bedroom
          {%- elif is_state('media_player.main_bathroom', 'playing') -%}
            media_player.main_bathroom
          {%- elif is_state('media_player.guest_bedroom', 'playing') -%}
            media_player.guest_bedroom
          {%- elif is_state('media_player.guest_bathroom', 'playing') -%}
            media_player.guest_bathroom
          {%- else -%}
            none
          {%- endif -%}

        active_playing_uri: >-
          {%- if is_state('media_player.spotify_thomas_vander_stichele', 'playing') -%}
            {{ state_attr('media_player.spotify_thomas_vander_stichele', 'media_content_id') | default('none') }}
          {%- elif states('media_player.unnamed_room') == 'playing' -%}
            {{ state_attr('media_player.unnamed_room', 'media_content_id') | default('none') }}
          {%- elif is_state('media_player.main_bedroom', 'playing') -%}
            {{ state_attr('media_player.main_bedroom', 'media_content_id') | default('none') }}
          {%- elif is_state('media_player.main_bathroom', 'playing') -%}
            {{ state_attr('media_player.main_bathroom', 'media_content_id') | default('none') }}
          {%- elif is_state('media_player.guest_bedroom', 'playing') -%}
            {{ state_attr('media_player.guest_bedroom', 'media_content_id') | default('none') }}
          {%- elif is_state('media_player.guest_bathroom', 'playing') -%}
            {{ state_attr('media_player.guest_bathroom', 'media_content_id') | default('none') }}
          {%- else -%}
            none
          {%- endif -%}

        resolved_device_temp: >-
          {%- set dev = input_device -%}
          {%- if dev in ['Current', 'none', '', none] -%}
            {%- if active_playing_entity == 'media_player.spotify_thomas_vander_stichele' and state_attr('media_player.spotify_thomas_vander_stichele', 'source') not in [none, '', 'none'] -%}
              {%- set dev = 'none' -%}
            {%- elif active_playing_entity == 'media_player.unnamed_room' -%}
              {%- set dev = 'Sonos Move' -%}
            {%- elif active_playing_entity in ['media_player.main_bedroom', 'media_player.main_bathroom', 'media_player.guest_bedroom', 'media_player.guest_bathroom'] -%}
              {%- set dev = state_attr(active_playing_entity, 'friendly_name') | default('Automatic') -%}
            {%- else -%}
              {%- set dev = 'Automatic' -%}
            {%- endif -%}
          {%- endif -%}

          {%- if dev == 'Automatic' -%}
            {%- if trigger_source == 'personal_phone' -%}
              {%- set dev = 'Personal Phone' -%}
            {%- elif trigger_source in ['work_streamdeck', 'work_desktop'] -%}
              {%- set dev = 'Work Desktop' -%}
            {%- elif trigger_source in ['main_bedroom', 'main_bedroom_button'] -%}
              {%- set dev = 'Main Bedroom' -%}
            {%- elif trigger_source in ['main_bathroom', 'main_bathroom_button'] -%}
              {%- set dev = 'Main Bathroom' -%}
            {%- elif trigger_source in ['guest_bathroom', 'guest_bathroom_button'] -%}
              {%- set dev = 'Guest Bathroom' -%}
            {%- elif trigger_source in ['guest_bedroom', 'guest_bedroom_button'] -%}
              {%- set dev = 'Guest Bedroom' -%}
            {%- elif trigger_source in ['home_streamdeck', 'kitchen_button', 'kitchen_tablet', 'balcony', 'dashboard'] or active_playing_entity == 'none' -%}
              {%- set dev = 'Living Room TV' -%}
            {%- else -%}
              {%- set dev = 'Living Room TV' -%}
            {%- endif -%}
          {%- endif -%}
          
          {%- if dev == 'Living Room TV' -%}
            {%- if is_state('input_select.living_room_tv_default_target', 'Google TV') -%}
              Living Room Google TV
            {%- else -%}
              Living Room Samsung TV
            {%- endif -%}
          {%- else -%}
            {{ dev }}
          {%- endif -%}

    # Evaluate the resolved device in a separate step
    - variables:
        resolved_device: "{{ resolved_device_temp | trim }}"

    # 5. Map resolved device to actual player parameters and determine playlist key
    - variables:
        target_entity_temp: >-
          {%- if resolved_device in ['Living Room TV', 'Living Room Samsung TV', 'Living Room Google TV'] -%}
            none
          {%- elif resolved_device == 'Main Bedroom' -%}
            media_player.main_bedroom
          {%- elif resolved_device == 'Main Bathroom' -%}
            media_player.main_bathroom
          {%- elif resolved_device == 'Guest Bathroom' -%}
            media_player.guest_bathroom
          {%- elif resolved_device == 'Guest Bedroom' -%}
            media_player.guest_bedroom
          {%- elif resolved_device in ['Sonos Move', 'Sonos Move 2', 'Move 2'] -%}
            {%- if states('media_player.unnamed_room') not in ['unavailable', 'unknown', 'none', none] -%}
              media_player.unnamed_room
            {%- else -%}
              none
            {%- endif -%}
          {%- else -%}
            none
          {%- endif -%}

        target_device_temp: >-
          {%- if resolved_device in ['Living Room Samsung TV', 'Samsung TV QN65Q90RAFXZA'] -%}
            Samsung TV QN65Q90RAFXZA
          {%- elif resolved_device in ['Living Room TV', 'Living Room Google TV'] -%}
            Living Room TV
          {%- elif resolved_device in ['Work Desktop', 'thomasvsd3'] -%}
            thomasvsd3.nyc.corp.google.com
          {%- elif resolved_device in ['Work Laptop', 'thomasvsl12'] -%}
            thomasvsl12
          {%- elif resolved_device == 'Personal Laptop' -%}
            Personal Laptop
          {%- elif resolved_device in ['Personal Phone', 'Pixel 10 Pro Fold', 'Pixel'] -%}
            Pixel 10 Pro Fold
          {%- elif resolved_device in ['Sonos Move', 'Sonos Move 2', 'Move 2'] -%}
            Move 2
          {%- else -%}
            none
          {%- endif -%}

        selected_playlist_temp: >-
          {%- set plist = input_playlist -%}
          {%- if plist in ['Current', 'none', '', none] -%}
            {%- if active_playing_entity != 'none' -%}
              {%- set plist = 'none' -%}
            {%- else -%}
              {%- set plist = 'Automatic' -%}
            {%- endif -%}
          {%- endif -%}

          {%- if plist == 'none' -%}
            none
          {%- elif plist != 'Automatic' -%}
            {{ plist | lower | replace(' ', '_') }}
          {%- else -%}
            {%- set current_day = now().strftime('%w') | int -%}
            {%- set current_hour = now().hour | int -%}
            {%- if current_day == 1 -%}
              discover_weekly
            {%- elif current_day == 5 -%}
              {%- if current_hour >= 9 and current_hour < 18 -%}
                flow
              {%- else -%}
                discover_weekly
              {%- endif -%}
            {%- elif current_day == 6 -%}
              release_radar
            {%- else -%}
              {{ ['this_quarter', 'this_year', 'thomas_favorites', 'new_discoveries'] | random }}
            {%- endif -%}
          {%- endif -%}

    # Clean the final target strings
    - variables:
        target_entity: "{{ target_entity_temp | trim }}"
        target_device: "{{ target_device_temp | trim }}"
        selected_playlist: "{{ selected_playlist_temp | trim }}"

    - service: system_log.write
      data:
        message: >-
          Spotify Smart Play [INFO] - Source: {{ trigger_source | default('none') }}, Destination: {{ resolved_device }}, Entity: {{ target_entity }}, Device Name: {{ target_device }}, Playlist: {{ selected_playlist }}
        level: info
        logger: custom_scripts.spotify_smart_play

    # 6. Trigger Playback
    - service: script.spotify_play_playlist
      data:
        entity_id: "{{ target_entity }}"
        device_name: "{{ target_device }}"
        playlist_name: "{{ selected_playlist }}"
