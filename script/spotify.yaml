spotify_select_samsung_tv:
  icon: "mdi:television"
  description: "Switch to spotify on Samsung TV"
  fields:
    entity_id:
      description: "The entity id of the Samsung TV"
      example: "media_player.samsung_tv"
  sequence:
  - variables:
      tv_was_off: "{{ not is_state('media_player.samsung_tv', 'on') }}"
  - if:
    - alias: "If TV is powered off at the plug and unavailable"
      condition: and
      conditions:
      - condition: state
        entity_id: switch.power_tv
        state: "off"
      - condition: state
        entity_id: media_player.samsung_tv
        state: "unavailable"
    then:
    - alias: "Turn on the power plug"
      service: switch.turn_on
      data:
        entity_id: switch.power_tv
    - alias: "Wait 10 seconds for TV power supply to boot"
      delay: 10

  - if:
    - alias: "If TV was not on"
      condition: template
      value_template: "{{ tv_was_off }}"
    then:
    - alias: "Turn on the TV"
      service: media_player.turn_on
      data:
        entity_id: media_player.samsung_tv
    - alias: "Send WoL packet (Ethernet)"
      service: wake_on_lan.send_magic_packet
      data:
        mac: "24:fc:e5:bb:ca:1f"
    - alias: "Send WoL packet (Wi-Fi)"
      service: wake_on_lan.send_magic_packet
      data:
        mac: "b8:bc:5b:c1:d4:04"
    - alias: "Wait for TV to boot"
      wait_template: "{{ is_state('media_player.samsung_tv', 'on') }}"
      timeout: "00:00:07"
  - service: media_player.turn_on
    data:
      entity_id: media_player.samsung_tv
  - service: wake_on_lan.send_magic_packet
    data:
      mac: "24:fc:e5:bb:ca:1f"
  - service: wake_on_lan.send_magic_packet
    data:
      mac: "b8:bc:5b:c1:d4:04"
  - service: media_player.turn_on
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
      source: "Spotify - Music and Podcasts"
  - service: media_player.media_play
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
  - service: media_player.volume_set
    data:
      volume_level: 0.56
    target:
      # device_id: 7b1d7bc5723a29396da3669f5645efa7 # Onkyo
      entity_id: media_player.tx_nr809


