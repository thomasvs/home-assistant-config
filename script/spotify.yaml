spotify_play_uri:
  icon: "mdi:party-popper"
  description: "Start playing a spotify URI on a media player"
  fields:
    device_name:
      description: "The name of the device to play on"
      example: "Living Room TV"
    uri:
      description: "The Spotify URI to play"
      example: "spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf"
    random_song:
      default: true
    repeat:
      description: "off/all/one"
      default: "all"
    shuffle:
      default: true
  sequence:
  - service: spotcast.start
    data:
      device_name: "{{ device_name }}"
      uri: "{{ uri }}"
      random_song: "{{ random_song | default(true) }}"
      shuffle: "{{ shuffle | default(true) }}"
      repeat: "{{ repeat | default(true) }}"
# - service: media_player.select_source
#   data:
#     entity_id: media_player.samsung_tv
#     source: HDMI

# If media_player.spotify_ isn't playing yet, .play_media or .set_shuffle says it's not supported
# media_player.play_media only accepts entity_id
# https://www.home-assistant.io/integrations/media_player
# defaults to entity_id: media_player.spotify_thomas_vander_stichele
spotify_play_uri_media_player:
  icon: "mdi:party-popper"
  description: "Start playing a spotify URI on a media player"
  fields:
    entity_id:
      description: "The entity_id of the media_player to play on"
    device_name:
      description: "The name of the device to play on, if entity_id is not set"
      example: "Living Room TV"
    playlist_name:
      description: "The name of the playlist to play, resolved from configuration"
      example: "this_year"
    uri:
      description: "The Spotify URI to play"
      example: "spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf"
    random_song:
      default: true
    repeat:
      description: "off/all/one"
      default: true
    shuffle:
      default: true
  sequence:
  - variables:
      # Trim inputs first to avoid whitespace leakage
      trimmed_entity_id: "{{ (entity_id | trim) if (entity_id is defined and entity_id != '' and entity_id != none) else 'none' }}"
      trimmed_device_name: "{{ (device_name | trim) if (device_name is defined and device_name != '' and device_name != none) else 'none' }}"
      trimmed_playlist_name: "{{ (playlist_name | trim) if (playlist_name is defined and playlist_name != '' and playlist_name != none) else 'none' }}"
      
      target_entity_id: "{{ trimmed_entity_id if (trimmed_entity_id != 'none') else 'media_player.spotify_thomas_vander_stichele' }}"
      playlists: "{{ state_attr('sensor.spotify_playlists', 'list') }}"
      playlist_info: "{{ playlists.get(trimmed_playlist_name) if (trimmed_playlist_name != 'none' and playlists is not none) else none }}"
      uri_to_play: "{{ playlist_info.uri if playlist_info is not none else (uri | default(none)) }}"
      shuffle_to_play: "{{ playlist_info.shuffle if (playlist_info is not none and playlist_info.shuffle is defined) else shuffle | default(true) }}"
      random_song_to_play: "{{ playlist_info.random_song if (playlist_info is not none and playlist_info.random_song is defined) else random_song | default(true) }}"
      repeat_to_play: "{{ playlist_info.repeat if (playlist_info is not none and playlist_info.repeat is defined) else repeat | default('off') }}"
      playlist_volume: "{{ playlist_info.volume | float(100) if (playlist_info is not none and playlist_info.volume is defined) else 100 }}"

      target_devices: "{{ state_attr('sensor.spotify_target_devices', 'list') }}"
      effective_target_device: >-
        {%- set ns = namespace(dev='none') -%}
        {%- set target_lookup = trimmed_device_name if trimmed_device_name != 'none' else (
            trimmed_entity_id if trimmed_entity_id != 'none' else state_attr('media_player.spotify_thomas_vander_stichele', 'source')
        ) -%}
        {%- if target_devices is not none and target_lookup not in [none, '', 'none'] -%}
          {%- if target_lookup in target_devices -%}
            {%- set ns.dev = target_lookup -%}
          {%- else -%}
            {%- for dev_name, dev_conf in target_devices.items() -%}
              {%- if target_lookup == dev_name 
                     or target_lookup in dev_conf.get('aliases', [])
                     or dev_conf.get('target_name') == target_lookup
                     or dev_conf.get('entity_id') == target_lookup
                     or dev_conf.get('volume_entity') == target_lookup
                     or (dev_name | lower | replace(' ', '_')) in target_lookup -%}
                {%- set ns.dev = dev_name -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endif -%}
        {{ ns.dev }}

      device_volume: >-
        {%- if target_devices is not none and effective_target_device != 'none' and effective_target_device in target_devices -%}
          {{ target_devices[effective_target_device].get('volume', 50) | float(50) }}
        {%- else -%}
          50
        {%- endif -%}

      volume_proxy_entity: >-
        {%- if target_devices is not none and effective_target_device != 'none' and effective_target_device in target_devices -%}
          {{ target_devices[effective_target_device].get('volume_entity', 'none') }}
        {%- elif trimmed_entity_id != 'none' and trimmed_entity_id != 'media_player.spotify_thomas_vander_stichele' -%}
          {{ trimmed_entity_id }}
        {%- else -%}
          none
        {%- endif -%}

      calculated_volume: "{{ (((playlist_volume | float(100)) / 100.0) * ((device_volume | float(50)) / 100.0)) | round(2) }}"

  - service: system_log.write
    data:
      message: >-
        Spotify Play URI [INFO] - Target Entity: {{ target_entity_id }}, Device: {{ trimmed_device_name }}, Active Target: {{ effective_target_device }}, Volume Proxy: {{ volume_proxy_entity }}, Playlist: {{ trimmed_playlist_name }}, URI: {{ uri_to_play }}, Playlist Vol: {{ playlist_volume }}%, Device Vol: {{ device_volume }}%, Final Vol: {{ calculated_volume }}
      level: info
      logger: custom_scripts.spotify_play_uri_media_player

  # 1. Travel Sonos Move dispatch (WebSocket event)
  - if:
    - condition: template
      value_template: "{{ effective_target_device in ['Sonos Move', 'Sonos Move 2', 'Move 2'] or trimmed_device_name in ['Sonos Move', 'Sonos Move 2', 'Move 2'] }}"
    then:
    - service: system_log.write
      data:
        message: "Spotify Play URI: Dispatching travel Sonos Move command via WebSocket"
        level: info
        logger: custom_scripts.spotify_play_uri_media_player
    - event: sonos_travel_command
      event_data:
        action: "{{ 'play' if uri_to_play is not none and uri_to_play != 'none' and uri_to_play != '' else 'transfer' }}"
        playlist: "{{ trimmed_playlist_name if trimmed_playlist_name != 'none' else uri_to_play }}"
        speaker: "Move 2"

  # 2. Standard Spotify Connect / TV input switching
  - if:
    - condition: template
      value_template: "{{ effective_target_device not in ['Sonos Move', 'Sonos Move 2', 'Move 2'] and trimmed_device_name not in ['Sonos Move', 'Sonos Move 2', 'Move 2'] and trimmed_entity_id == 'none' and trimmed_device_name != 'none' }}"
    then:
    - choose:
      - conditions:
        - "{{ trimmed_device_name in ['Living Room Samsung TV', 'Samsung TV QN65Q90RAFXZA'] }}"
        sequence:
        - service: system_log.write
          data:
            message: "Spotify Play URI: Switching input to Samsung TV app"
            level: info
            logger: custom_scripts.spotify_play_uri_media_player
        - service: script.spotify_select_samsung_tv
          data:
            entity_id: "media_player.samsung_tv"
      - conditions:
        - "{{ trimmed_device_name == 'Living Room TV' }}"
        - condition: template
          value_template: >-
            {# Only boot Google TV if the TV is off or Spotify is not yet running on it #}
            {{ not is_state('media_player.samsung_tv', 'on')
               or state_attr('media_player.spotify_thomas_vander_stichele', 'source_list') is none
               or 'Living Room TV' not in state_attr('media_player.spotify_thomas_vander_stichele', 'source_list') }}
        sequence:
        - service: system_log.write
          data:
            message: "Spotify Play URI: Switching input to Google TV (HDMI4)"
            level: info
            logger: custom_scripts.spotify_play_uri_media_player
        - service: script.spotify_select_google_tv
          data:
            entity_id: "media_player.samsung_tv"
        # For Living Room TV, wait up to 10s for the newly launched Android app to register in source_list
        - wait_template: >-
            {{ state_attr('media_player.spotify_thomas_vander_stichele', 'source_list') is not none 
               and 'Living Room TV' in state_attr('media_player.spotify_thomas_vander_stichele', 'source_list') }}
          timeout: "00:00:10"
    # Request Spotify entity update to pull fresh active devices from Spotify Web API
    - service: homeassistant.update_entity
      data:
        entity_id: media_player.spotify_thomas_vander_stichele
    # Transfer playback directly to target Spotify Connect device without blocking on local polling cache
    - service: media_player.select_source
      data:
        entity_id: media_player.spotify_thomas_vander_stichele
        source: "{{ trimmed_device_name }}"

  # 3. Standard Cloud Playback (skip for Sonos Move)
  - if:
    - condition: template
      value_template: "{{ uri_to_play is not none and uri_to_play != 'none' and uri_to_play != '' and effective_target_device not in ['Sonos Move', 'Sonos Move 2', 'Move 2'] and trimmed_device_name not in ['Sonos Move', 'Sonos Move 2', 'Move 2'] }}"
    then:
    - if:
      - condition: template
        value_template: >-
          {{ target_entity_id != 'media_player.spotify_thomas_vander_stichele' or (
             state_attr('media_player.spotify_thomas_vander_stichele', 'supported_features') is not none
             and ((state_attr('media_player.spotify_thomas_vander_stichele', 'supported_features') | int(0) // 512) % 2 == 1)
          ) }}
      then:
      - if:
        - condition: template
          value_template: "{{ ('spotify' in target_entity_id or 'main_bedroom' in target_entity_id or 'main_bathroom' in target_entity_id or 'guest_bedroom' in target_entity_id or 'guest_bathroom' in target_entity_id) and state_attr(target_entity_id, 'supported_features') is not none and ((state_attr(target_entity_id, 'supported_features') | int(0) // 16384) % 2 == 1) }}"
        - condition: template
          value_template: "{{ state_attr(target_entity_id, 'shuffle') != (random_song_to_play | default(true)) }}"
        then:
        - service: media_player.shuffle_set
          data:
            entity_id: "{{ target_entity_id }}"
            shuffle: "{{ random_song_to_play | default(true) }}"
      - service: media_player.play_media
        data:
          entity_id: "{{ target_entity_id }}"
          media_content_id: "{{ uri_to_play }}"
          media_content_type: "playlist"
      - wait_template: "{{ states(target_entity_id) not in ['unknown', 'unavailable', 'idle'] }}"
        timeout: "00:00:05"
  - if:
    - condition: template
      value_template: "{{ volume_proxy_entity is defined and volume_proxy_entity not in ['none', '', none, 'media_player.spotify_thomas_vander_stichele'] and calculated_volume is defined and (calculated_volume | float(0)) > 0 }}"
    then:
    - service: media_player.volume_set
      data:
        entity_id: "{{ volume_proxy_entity }}"
        volume_level: "{{ calculated_volume }}"
  - if:
    - condition: template
      value_template: >-
        {{ uri_to_play is not none and uri_to_play != 'none' and uri_to_play != ''
           and (target_entity_id != 'media_player.spotify_thomas_vander_stichele' or (
             state_attr('media_player.spotify_thomas_vander_stichele', 'supported_features') is not none
             and ((state_attr('media_player.spotify_thomas_vander_stichele', 'supported_features') | int(0) // 512) % 2 == 1)
           )) }}
    then:
    - if:
      - condition: template
        value_template: "{{ ('spotify' in target_entity_id or 'main_bedroom' in target_entity_id or 'main_bathroom' in target_entity_id or 'guest_bedroom' in target_entity_id or 'guest_bathroom' in target_entity_id) and state_attr(target_entity_id, 'supported_features') is not none and ((state_attr(target_entity_id, 'supported_features') | int(0) // 16384) % 2 == 1) }}"
      - condition: template
        value_template: "{{ (shuffle_to_play | default(true)) != (random_song_to_play | default(true)) }}"
      - condition: template
        value_template: "{{ state_attr(target_entity_id, 'shuffle') != (shuffle_to_play | default(true)) }}"
      then:
      - service: media_player.shuffle_set
        data:
          entity_id: "{{ target_entity_id }}"
          shuffle: "{{ shuffle_to_play | default(true) }}"
    - if:
      - condition: template
        value_template: "{{ ('spotify' in target_entity_id or 'main_bedroom' in target_entity_id or 'main_bathroom' in target_entity_id or 'guest_bedroom' in target_entity_id or 'guest_bathroom' in target_entity_id) and state_attr(target_entity_id, 'supported_features') is not none and ((state_attr(target_entity_id, 'supported_features') | int(0) // 262144) % 2 == 1) }}"
      - condition: template
        value_template: "{{ state_attr(target_entity_id, 'repeat') != (repeat_to_play | default('off')) }}"
      then:
      - service: media_player.repeat_set
        data:
          entity_id: "{{ target_entity_id }}"
          repeat: "{{ repeat_to_play | default('off') }}"
  - if:
    - condition: template
      value_template: >-
        {{ target_entity_id != 'media_player.spotify_thomas_vander_stichele'
           and states(target_entity_id) == 'paused'
           and state_attr(target_entity_id, 'supported_features') is not none
           and ((state_attr(target_entity_id, 'supported_features') | int(0) // 16384) % 2 == 1) }}
    then:
    - service: media_player.media_play
      data:
        entity_id: "{{ target_entity_id }}"
  - if:
    - condition: template
      value_template: "{{ trimmed_device_name == 'Living Room TV' }}"
    then:
    - alias: "Wait for Spotify Connect state to register as playing"
      wait_template: "{{ is_state('media_player.spotify_thomas_vander_stichele', 'playing') }}"
      timeout: "00:00:03"
    - alias: "Send commands to open Now Playing fullscreen"
      service: remote.send_command
      data:
        entity_id: remote.living_room_google_tv_remote
        command:
          - DPAD_UP
          - DPAD_CENTER




