spotify_play_uri:
  icon: "mdi:party-popper"
  description: "Start playing a spotify URI on a media player"
  fields:
    device_name:
      description: "The name of the device to play on"
      example: "Living Room TV"
    uri:
      description: "The Spotify URI to play"
      example: "spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf"
    random_song:
      default: true
    repeat:
      description: "off/all/one"
      default: "all"
    shuffle:
      default: true
  sequence:
  - service: spotcast.start
    data:
      device_name: "{{ device_name }}"
      uri: "{{ uri }}"
      random_song: "{{ random_song | default(true) }}"
      shuffle: "{{ shuffle | default(true) }}"
      repeat: "{{ repeat | default(true) }}"
# - service: media_player.select_source
#   data:
#     entity_id: media_player.samsung_tv
#     source: HDMI

# If media_player.spotify_ isn't playing yet, .play_media or .set_shuffle says it's not supported
# media_player.play_media only accepts entity_id
# https://www.home-assistant.io/integrations/media_player
# defaults to entity_id: media_player.spotify_thomas_vander_stichele
spotify_play_uri_media_player:
  icon: "mdi:party-popper"
  description: "Start playing a spotify URI on a media player"
  fields:
    entity_id:
      description: "The entity_id of the media_player to play on"
    device_name:
      description: "The name of the device to play on, if entity_id is not set"
      example: "Living Room TV"
    playlist_name:
      description: "The name of the playlist to play, resolved from configuration"
      example: "this_year"
    uri:
      description: "The Spotify URI to play"
      example: "spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf"
    random_song:
      default: true
    repeat:
      description: "off/all/one"
      default: true
    shuffle:
      default: true
  sequence:
  - variables:
      target_entity_id: "{{ entity_id if (entity_id is defined and entity_id != '' and entity_id != none) else 'media_player.spotify_thomas_vander_stichele' }}"
      playlists: "{{ state_attr('sensor.spotify_playlists', 'list') if (state_attr('sensor.spotify_playlists', 'list') is not none) else state_attr('sensor.spotify_playlists_2', 'list') }}"
      playlist_info: "{{ playlists.get(playlist_name) if (playlist_name is defined and playlist_name != '' and playlist_name != none and playlists is not none) else none }}"
      uri_to_play: "{{ playlist_info.uri if playlist_info is not none else uri }}"
      shuffle_to_play: "{{ playlist_info.shuffle if (playlist_info is not none and playlist_info.shuffle is defined) else shuffle | default(true) }}"
      random_song_to_play: "{{ playlist_info.random_song if (playlist_info is not none and playlist_info.random_song is defined) else random_song | default(true) }}"
      repeat_to_play: "{{ playlist_info.repeat if (playlist_info is not none and playlist_info.repeat is defined) else repeat | default('off') }}"
  - choose:
    - conditions:
      - "{{ entity_id is not defined or entity_id == '' or entity_id == none }}"
      - "{{ device_name is defined and device_name != '' and device_name != none }}"
      - "{{ state_attr('media_player.spotify_thomas_vander_stichele', 'source') != device_name }}"
      sequence:
      - service: media_player.select_source
        data:
          entity_id: media_player.spotify_thomas_vander_stichele
          source: "{{ device_name }}"
   # first set shuffle; this should start at a random song on playback
  # if you want no shuffle but start at a random song, set shuffle true, play, set shuffle false
  # if you want shuffle and start at a random song, set shuffle true, play
  # if you want shuffle and start at the start, set shuffle false, play, set shuffle true
  # https://github.com/home-assistant/core/issues/31607
  - if:
    - "{{ state_attr(target_entity_id, 'shuffle') != (random_song_to_play | default(true)) }}"
    then:
    - service: media_player.shuffle_set
      data:
        entity_id: "{{ target_entity_id }}"
        shuffle: "{{ random_song_to_play | default(true) }}"
  - service: media_player.play_media
    data:
      entity_id: "{{ target_entity_id }}"
      media_content_id: "{{ uri_to_play }}"
      media_content_type: "playlist"
  - if:
    - "{{ (shuffle_to_play | default(true)) != (random_song_to_play | default(true)) }}"
    - "{{ state_attr(target_entity_id, 'shuffle') != (shuffle_to_play | default(true)) }}"
    then:
    - service: media_player.shuffle_set
      data:
        entity_id: "{{ target_entity_id }}"
        shuffle: "{{ shuffle_to_play | default(true) }}"
  - if:
    - "{{ state_attr(target_entity_id, 'repeat') != (repeat_to_play | default('off')) }}"
    then:
    - service: media_player.repeat_set
      data:
        entity_id: "{{ target_entity_id }}"
        repeat: "{{ repeat_to_play | default('off') }}"

spotify_play_playlist:
  icon: "mdi:party-popper"
  fields:
    entity_id:
      description: "The entity_id of the media_player to play on"
    device_name:
      description: "The name of the device to play on"
      example: "Living Room TV"
    playlist_name:
      description: "name of the playlist"
      example: "house_vander_gonzalez"
  sequence:
  - service: script.spotify_play_uri_media_player
    data:
      entity_id: "{{ entity_id }}"
      device_name: "{{ device_name }}"
      playlist_name: "{{ playlist_name }}"



