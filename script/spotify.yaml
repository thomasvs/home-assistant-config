      mac: "b8:bc:5b:c1:d4:04"
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
      source: "TV"
  - delay: 0.3
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
      source: "HDMI"
  - delay: 0.3
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
      source: "HDMI"
  - delay: 0.3
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
      source: "HDMI"
  - delay: 0.3
  - service: media_player.select_source
    data:
      entity_id: "{{ entity_id | default('media_player.samsung_tv', true) }}"
