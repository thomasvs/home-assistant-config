spotify_play_uri:
  icon: "mdi:party-popper"
  description: "Start playing a spotify URI on a media player"
  fields:
    device_name:
      description: "The name of the device to play on"
      example: "Living Room TV"
    uri:
      description: "The Spotify URI to play"
      example: "spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf"
    random_song:
      default: true
    repeat:
      description: "off/all/one"
      default: "all"
    shuffle:
      default: true
  sequence:
  - service: spotcast.start
    data:
      device_name: "{{ device_name }}"
      uri: "{{ uri }}"
      random_song: "{{ random_song | default(true) }}"
      shuffle: "{{ shuffle | default(true) }}"
      repeat: "{{ repeat | default(true) }}"
# - service: media_player.select_source
#   data:
#     entity_id: media_player.samsung_tv
#     source: HDMI

# If media_player.spotify_ isn't playing yet, .play_media or .set_shuffle says it's not supported
# media_player.play_media only accepts entity_id
# https://www.home-assistant.io/integrations/media_player
# defaults to entity_id: media_player.spotify_thomas_vander_stichele
spotify_play_uri_media_player:
  icon: "mdi:party-popper"
  description: "Start playing a spotify URI on a media player"
  fields:
    entity_id:
      description: "The entity_id of the media_player to play on"
    device_name:
      description: "The name of the device to play on, if entity_id is not set"
      example: "Living Room TV"
    uri:
      description: "The Spotify URI to play"
      example: "spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf"
    random_song:
      default: true
    repeat:
      description: "off/all/one"
      default: true
    shuffle:
      default: true
  sequence:
  - variables:
      device_label: "{{ 'device_name' if (device_name is defined and device_name != '' and device_name != none) else 'entity_id' if (entity_id is defined and entity_id != '' and entity_id != none) else 'entity_id' }}"
      device_value: "{{ device_name if (device_name is defined and device_name != '' and device_name != none) else entity_id if (entity_id is defined and entity_id != '' and entity_id != none) else 'media_player.spotify_thomas_vander_stichele' }}"
   # first set shuffle; this should start at a random song on playback
  # if you want no shuffle but start at a random song, set shuffle true, play, set shuffle false
  # if you want shuffle and start at a random song, set shuffle true, play
  # if you want shuffle and start at the start, set shuffle false, play, set shuffle true
  # https://github.com/home-assistant/core/issues/31607
  - service: media_player.shuffle_set
    data:
      "{{ device_label }}": "{{ device_value }}"
      shuffle: "{{ random_song | default(true) }}"
  - service: media_player.play_media
    data:
      "{{ device_label }}": "{{ device_value }}"
        #    data: >
        #      {% if entity_id %}entity_id: "{{ entity_id }}"
        #{% else %}device_name: "{{ device_name }}"
        #{% endif %}
      media_content_id: "{{ uri }}"
      media_content_type: "playlist"
        #      uri: "{{ uri }}"
  - service: media_player.shuffle_set
    data:
      "{{ device_label }}": "{{ device_value }}"
      shuffle: "{{ shuffle | default(true) }}"
  - service: media_player.repeat_set
    data:
      "{{ device_label }}": "{{ device_value }}"
      repeat: "{{ repeat | default('off') }}"
# - service: media_player.select_source
#   data:
#     entity_id: media_player.samsung_tv
#     source: HDMI

spotify_play_playlist:
  icon: "mdi:party-popper"
  fields:
    entity_id:
      description: "The entity_id of the media_player to play on"
    device_name:
      description: "The name of the device to play on"
      example: "Living Room TV"
    playlist_name:
      description: "name of the playlist"
      example: "house_vander_gonzalez"
  sequence:
  - variables:
      device_label: "{{ 'device_name' if (device_name is defined and device_name != '' and device_name != none) else 'entity_id' if (entity_id is defined and entity_id != '' and entity_id != none) else 'entity_id' }}"
        #device_value: "'entity_id is {{ entity_id != '' }}' - {{ device_name if (device_name is defined and device_name != none) else entity_id if (entity_id is defined and entity_id != '' and entity_id != none) else 'media_player.spotify_thomas_vander_stichele' }}"
      device_value: "{{ device_name if (device_name is defined and device_name != '' and device_name != none) else entity_id if (entity_id is defined and entity_id != '' and entity_id != none) else 'media_player.spotify_thomas_vander_stichele' }}"
      playlist_name: "{{ playlist_name }}"
  - service: script.spotify_play_uri_media_player
    data:
      "{{ device_label }}": "{{ device_value }}"
      uri: "{{ {'upcoming_concerts': 'spotify:playlist:7BZ4DbXIDW1wQ0PTSBefVf', 'house_vander_gonzalez': 'spotify:playlist:5AegsLBfQYmqByIN9HRDrW', 'thomas_favorites': 'spotify:playlist:0e3iXlZzfDAOQXv5YPF9Oh', 'this_quarter': 'spotify:playlist:21h0G1p0u2ONawQo4Qzhcu', 'flow': 'spotify:playlist:5sTRodSYI501CIHUsmWmSI'}.get(playlist_name) }}"
      shuffle: "{{ {'upcoming_concerts': false, 'house_vander_gonzalez': true, 'thomas_favorites': true, 'this_quarter': false, 'flow': false }.get(playlist_name) }}"
      random_song: "{{ {'upcoming_concerts': true, 'house_vander_gonzalez': true, 'thomas_favorites': true, 'this_quarter': true, 'flow': true }.get(playlist_name) }}"
      repeat: 'all'



