- alias: Remotec-4 - 1 Living Room TV Power On
  trigger:
    platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: 56
      command_class_name: Central Scene
      property: scene
      property_key: '001'
      value: KeyPressed
  action:
  - service: switch.turn_on
    entity_id: switch.power_tv

- alias: Remotec-4 - 1 Living Room TV Power Off
  trigger:
    platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: 56
      command_class_name: Central Scene
      property: scene
      property_key: '001'
      value: KeyPressed2x
  action:
  - service: switch.turn_off
    entity_id: switch.power_tv


- alias: Remotec-4 - 5 Living Room FIOS
  trigger:
    platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: 56
      command_class_name: Central Scene
      property: scene
      property_key: '005'
      value: KeyPressed
  action:
  - service: wake_on_lan.send_magic_packet
    data:
      mac: "24:fc:e5:bb:ca:1f"
  - service: wake_on_lan.send_magic_packet
    data:
      mac: "b8:bc:5b:c1:d4:04"
  - service: scene.turn_on
    entity_id: scene.living_room_fios

