- id: doorbird_entry_ring
  alias: Doorbird Entry Ring
  trigger:
    - platform: event
      event_type: doorbird_doorbird_entry_doorbell
    - platform: state
      entity_id: event.doorbird_entry_doorbell
  mode: single
  max_exceeded: silent
  action:
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.doorbird_last_ring
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - service: camera.snapshot
#     last_ring not yet updated by the time it triggers
#     entity_id: camera.doorbird_entry_last_ring
      entity_id: camera.doorbird_entry_live
      data:
        filename: /config/www/doorbell/lastring.jpg
    - service: local_file.update_file_path
      target:
        entity_id: camera.doorbird_last_ring
      data:
        file_path: /config/www/doorbell/lastring.jpg
    - delay:
        milliseconds: 500
    - service: media_player.play_media
      entity_id: media_player.living_room_tv
      data:
        media_content_type: image/jpeg
        media_content_id: 'https://amantes.duckdns.org:8123/local/doorbell/lastring.jpg'
    - service: media_player.play_media
      entity_id: media_player.balcony_display
      data:
        media_content_type: image/jpeg
        media_content_id: 'https://amantes.duckdns.org:8123/local/doorbell/lastring.jpg'
    - service: media_player.play_media
      entity_id: media_player.living_room_mural
      data:
        media_content_type: image/jpeg
        media_content_id: 'https://amantes.duckdns.org:8123/local/doorbell/lastring.jpg'
    - service: script.turn_on
      target:
        entity_id:
          - script.cozyla_popup_doorbell
          - script.pixel_tablet_popup_doorbell
    - service: tts.google_say
      entity_id: media_player.kitchen_home
      data_template:
        message: "There is someone at the door."

- id: doorbird_entry_motion
  alias: Doorbird Entry Motion
  trigger:
    - platform: event
      event_type: doorbird_doorbird_entry_motion
    - platform: state
      entity_id: event.doorbird_entry_motion
  mode: single
  max_exceeded: silent
  action:
    - service: camera.snapshot
      entity_id: camera.doorbird_entry_live
      data:
        filename: /config/www/doorbell/lastmotion.jpg
    - service: local_file.update_file_path
      target:
        entity_id: camera.doorbird_last_motion
      data:
        file_path: /config/www/doorbell/lastmotion.jpg
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.doorbird_last_motion
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
