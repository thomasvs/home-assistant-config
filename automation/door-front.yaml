- id: front_door_lock_jammed_notification
  alias: "Front Door Lock Jammed Notification"
  trigger:
    - platform: event
      event_type: keymaster_lock_state_changed
      event_data:
        entity_id: lock.lock_front_door
        state: "jammed"
    - platform: state
      entity_id: lock.lock_front_door
      to: "jammed"
  action:
    - service: notify.thomas_devices
      data:
        title: "Front Door Lock Jammed"
        message: "Front Door lock is jammed!"
        data:
          group: "Front Door"
          tag: "front-door"
          actions:
            - action: "UNLOCK"
              title: "Unlock Front Door"
              icon: "sfsymbols.lock.open"
            - action: "LOCK"
              title: "Retry Lock"
              icon: "sfsymbols.lock"
