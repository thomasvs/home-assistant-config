- alias: Living Space Blinds Open in Morning
  trigger:
    platform: template
    value_template: "{{ states('sensor.time') == (state_attr('input_datetime.morning_blinds_open_time', 'timestamp') | int | timestamp_custom('%H:%M', False)) }}"
  condition:
    - condition: state
      entity_id: 'input_boolean.automatic_blinds'
      state: 'on'
  action:
    - service: cover.open_cover
      entity_id:
        - cover.living_room_left_front
        - cover.living_room_middle_front
        - cover.living_room_right_front
        - cover.balcony_west_front

- alias: Calculate North Blinds Daily Times
  trigger:
    - platform: time
      at: "00:01:00"
    - platform: homeassistant
      event: start
  action:
    - delay: "00:00:10"
    - service: shell_command.calculate_blind_times

- alias: Close North Blinds in Morning Sun
  trigger:
    - platform: template
      value_template: "{{ states('sensor.time') == (state_attr('input_datetime.north_blinds_close_time', 'timestamp') | int | timestamp_custom('%H:%M', False)) }}"
  condition:
    - condition: state
      entity_id: 'input_boolean.automatic_north_blinds'
      state: 'on'
    - condition: template
      value_template: "{{ states('input_datetime.north_blinds_close_time') != '00:00:00' }}"
  action:
    - service: cover.close_cover
      entity_id:
        - cover.balcony_north_left_front
        - cover.balcony_north_right_front

