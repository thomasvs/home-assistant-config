- alias: Open Living Space Blinds 30 minutes before Sunset
  trigger:
    platform: sun
    event: sunset
    offset: '-00:30:00'
  condition:
    - condition: state
      entity_id: 'input_boolean.automatic_blinds'
      state: 'on'
    - condition: state
      entity_id: 'input_boolean.show_the_sunset'
      state: 'on'
  action:
    service: scene.turn_on
    entity_id:
    - scene.balcony_open
    - scene.living_room_open

