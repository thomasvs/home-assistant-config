- sensor:
    - name: "VeSync Air Quality"
      state: "{{ state_attr('fan.levoit_131s_air_purifier', 'air_quality') | title }}"

    - name: "Main Bedroom Night Blinds"
      unique_id: main_bedroom_night_blinds
      state: >-
        {% if is_state("binary_sensor.main_bedroom_window", "off") %}
          Closed
        {% elif states('sensor.pirateweather_home_wind_speed_0h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
          Partly
        {% elif states('sensor.pirateweather_home_wind_speed_8h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
          Partly
        {% else %}
          Closed
        {% endif %}
      attributes:
        reason: >-
          {% if is_state("binary_sensor.main_bedroom_window", "off") %}
            Closed: Window Closed
          {% elif states('sensor.pirateweather_home_wind_speed_0h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
            Partly: Wind Speed Now High
          {% elif states('sensor.pirateweather_home_wind_speed_8h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
            Partly: Wind Speed 6h High
          {% else %}
            Closed: Wind Speed Low
          {% endif %}

    - name: "Guest Bedroom Night Blinds"
      unique_id: guest_bedroom_night_blinds
      state: >-
        {% if is_state("binary_sensor.guest_bedroom_window", "off") %}
          Closed
        {% elif states('sensor.pirateweather_home_wind_speed_0h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
          Partly
        {% elif states('sensor.pirateweather_home_wind_speed_8h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
          Partly
        {% else %}
          Closed
        {% endif %}
      attributes:
        reason: >-
          {% if is_state("binary_sensor.guest_bedroom_window", "off") %}
            Closed: Window Closed
          {% elif states('sensor.pirateweather_home_wind_speed_0h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
            Partly: Wind Speed Now High
          {% elif states('sensor.pirateweather_home_wind_speed_8h')|float(0) > states('input_number.max_wind_speed_closed_blinds')|float(0) %}
            Partly: Wind Speed 6h High
          {% else %}
            Closed: Wind Speed Low
          {% endif %}

    - name: "Average Dry Humidity"
      unique_id: average_dry_humidity
      unit_of_measurement: '%'
      state: >-
        {% set ns = namespace(count=0,sum=0.0) %}
        {% set sensors = ['kitchen', 'guest_bedroom'] %}
        {% for s in sensors %}
          {% set id = 'sensor.sensor_' + s + '_humidity' %}
          {% if states(id) != 'unavailable' %}
            {% set ns.count = ns.count + 1 %}
            {% set ns.sum = ns.sum + states(id)|float(0) %}
          {% endif %}
        {% endfor %}
        {{ '%0.1f'|format(ns.sum / ns.count) if ns.count > 0 else 0 }}

    - name: "Spotify Active Target Device"
      unique_id: spotify_active_target_device
      icon: "mdi:speaker-wireless"
      state: >-
        {% set target_devices = state_attr('sensor.spotify_target_devices', 'list') or {} %}
        {% set is_travel_playing = states.sensor.sonos_move_travel is defined 
            and states.sensor.sonos_move_travel.state == 'playing'
            and (as_timestamp(now()) - as_timestamp(states.sensor.sonos_move_travel.last_updated)) < 30 %}
        {% set spotify_playing = is_state('media_player.spotify_thomas_vander_stichele', 'playing') %}
        {% set spotify_source = state_attr('media_player.spotify_thomas_vander_stichele', 'source') | default(none) %}
        {% set ns = namespace(device='Idle') %}
        {% if is_travel_playing or states('media_player.unnamed_room') == 'playing' %}
          {% set ns.device = 'Sonos Move' %}
        {% elif spotify_playing and spotify_source not in [none, '', 'none'] %}
          {% if spotify_source in target_devices %}
            {% set ns.device = spotify_source %}
          {% else %}
            {% for dev_name, dev_conf in target_devices.items() %}
              {% if spotify_source == dev_name 
                     or spotify_source in dev_conf.get('aliases', [])
                     or dev_conf.get('target_name') == spotify_source
                     or dev_conf.get('entity_id') == spotify_source %}
                {% set ns.device = dev_name %}
              {% endif %}
            {% endfor %}
            {% if ns.device == 'Idle' %}
              {% set ns.device = spotify_source %}
            {% endif %}
          {% endif %}
        {% else %}
          {% for entity_id, dev_name in [
              ('media_player.main_bedroom', 'Main Bedroom'),
              ('media_player.main_bathroom', 'Main Bathroom'),
              ('media_player.guest_bathroom', 'Guest Bathroom'),
              ('media_player.guest_bedroom', 'Guest Bedroom'),
              ('media_player.samsung_tv', 'Living Room Samsung TV')
          ] %}
            {% if is_state(entity_id, 'playing') and ns.device == 'Idle' %}
              {% set ns.device = dev_name %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.device }}
      attributes:
        is_playing: >-
          {{ is_state('media_player.spotify_thomas_vander_stichele', 'playing')
             or states('media_player.unnamed_room') == 'playing'
             or is_state('media_player.main_bedroom', 'playing')
             or is_state('media_player.main_bathroom', 'playing')
             or is_state('media_player.guest_bathroom', 'playing')
             or is_state('media_player.guest_bedroom', 'playing')
             or (states.sensor.sonos_move_travel is defined and states.sensor.sonos_move_travel.state == 'playing') }}
        spotify_source: "{{ state_attr('media_player.spotify_thomas_vander_stichele', 'source') }}"
        media_title: "{{ state_attr('media_player.spotify_thomas_vander_stichele', 'media_title') }}"
        media_artist: "{{ state_attr('media_player.spotify_thomas_vander_stichele', 'media_artist') }}"
        media_album: "{{ state_attr('media_player.spotify_thomas_vander_stichele', 'media_album_name') }}"
        media_uri: "{{ state_attr('media_player.spotify_thomas_vander_stichele', 'media_content_id') }}"
        volume_entity: >-
          {% set target_devices = state_attr('sensor.spotify_target_devices', 'list') or {} %}
          {% set dev = this.state | default('none') %}
          {{ target_devices.get(dev, {}).get('volume_entity', 'none') if dev in target_devices else 'none' }}

- binary_sensor:
    - name: "Main Bedroom AC"
      unique_id: main_bedroom_ac
      device_class: power
      state: >-
        {{ states('sensor.power_neo_main_bedroom_ac_power')|float(0) > 0 }}

    - name: "Guest Bedroom AC"
      unique_id: guest_bedroom_ac
      device_class: power
      state: >-
        {{ states('sensor.power_neo_guest_bedroom_ac_power')|float(0) > 0 }}

    - name: "Main Bedroom Window"
      unique_id: main_bedroom_window
      device_class: window
      state: >-
        {{ is_state("sensor.sensor_hank_mber_window", "22") }}

    - name: "Guest Bedroom Window"
      unique_id: guest_bedroom_window
      device_class: window
      state: >-
        {{ is_state("sensor.sensor_hank_gber_window", "22") }}

    - name: "Main Bedroom Door"
      unique_id: door_mber
      device_class: door
      state: >-
        {{ not is_state("sensor.vision_door_main_bedroom_alarm_level", "0") }}

    - name: "Main Bedroom Door Closet"
      unique_id: door_mber_closet
      device_class: door
      state: >-
        {{ not is_state("sensor.vision_door_main_bedroom_closet_alarm_level", "0") }}

    - name: "Guest Bedroom Door"
      unique_id: door_gber
      device_class: door
      state: >-
        {{ is_state("sensor.aeotec7_door_guest_bedroom_alarm_level", "22") }}

    - name: "Guest Bedroom Door Closet"
      unique_id: door_gber_closet
      device_class: door
      state: >-
        {{ not is_state("sensor.vision_door_guest_bedroom_closet_alarm_level", "0") }}

    - name: "Guest Bathroom Door"
      unique_id: door_gbar
      device_class: door
      state: >-
        {{ not is_state("sensor.vision_door_guest_bathroom_alarm_level", "0") }}

    - name: "Hallway Closet"
      unique_id: door_hallway_closet
      device_class: door
      state: >-
        {{ not is_state("sensor.vision_door_hallway_closet_alarm_level", "0") }}

    - name: "Main Bedroom AC Blocked"
      unique_id: main_bedroom_ac_blocked
      state: >-
        {% if is_state("binary_sensor.main_bedroom_window", "on") %}
          on
        {% else %}
          off
        {% endif %}

    - name: "Guest Bedroom AC Blocked"
      unique_id: guest_bedroom_ac_blocked
      state: >-
        {{ is_state("binary_sensor.guest_bedroom_window", "on") }}

    - name: "Herb Garden Left Moisture"
      unique_id: herb_garden_left_moisture
      device_class: "moisture"
      state: >-
        {{ is_state("sensor.leak_hs_ls100_herb_garden_left_flood", "2") }}

    - name: "Herb Garden Right Moisture"
      unique_id: herb_garden_right_moisture
      device_class: "moisture"
      state: >-
        {{ is_state("sensor.leak_hs_ls100_herb_garden_right_flood", "2") }}

- light:
    - name: "Kitchen Grow"
      unique_id: kitchen_grow
      state: '{{ is_state("switch.power_aeotec_kitchen_grow_light", "on") }}'
      level: '{{ 255 if is_state("switch.power_aeotec_kitchen_grow_light", "on") else 0 }}'
      turn_on:
        action: switch.turn_on
        target:
          entity_id: switch.power_aeotec_kitchen_grow_light
      turn_off:
        action: switch.turn_off
        target:
          entity_id: switch.power_aeotec_kitchen_grow_light
      set_level:
        action: >-
          switch.turn_{{ "off" if brightness == 0 else "on" }}
        target:
          entity_id: switch.power_aeotec_kitchen_grow_light

    - name: "Kitchen Cabinet Backsplash"
      unique_id: kitchen_cabinet_backsplash
      state: '{{ is_state("switch.power_hank_kitchen_backsplash", "on") }}'
      level: '{{ 255 if is_state("switch.power_hank_kitchen_backsplash", "on") else 0 }}'
      turn_on:
        action: switch.turn_on
        target:
          entity_id: switch.power_hank_kitchen_backsplash
      turn_off:
        action: switch.turn_off
        target:
          entity_id: switch.power_hank_kitchen_backsplash
      set_level:
        action: >-
          switch.turn_{{ "off" if brightness == 0 else "on" }}
        target:
          entity_id: switch.power_hank_kitchen_backsplash

    - name: "Kitchen Cabinet Passthrough"
      unique_id: kitchen_cabinet_passthrough
      state: '{{ is_state("switch.power_neo_kitchen_passthrough", "on") }}'
      level: '{{ 255 if is_state("switch.power_neo_kitchen_passthrough", "on") else 0 }}'
      turn_on:
        action: switch.turn_on
        target:
          entity_id: switch.power_neo_kitchen_passthrough
      turn_off:
        action: switch.turn_off
        target:
          entity_id: switch.power_neo_kitchen_passthrough
      set_level:
        action: >-
          switch.turn_{{ "off" if brightness == 0 else "on" }}
        target:
          entity_id: switch.power_neo_kitchen_passthrough

    - name: "Meural"
      unique_id: meural
      state: '{{ states("sensor.meural_backlight") not in ["unavailable", "unknown", "none", "0"] }}'
      level: '{{ (states("sensor.meural_backlight") | float(80) / 100 * 255) | int }}'
      turn_on:
        action: rest_command.meural_resume
      turn_off:
        action: rest_command.meural_suspend
      set_level:
        - action: input_number.set_value
          target:
            entity_id: input_number.meural_canvas_backlight
          data:
            value: "{{ (brightness / 255 * 100) | round(0) | int }}"
        - action: rest_command.meural_setbacklight
          data:
            backlight: "{{ (brightness / 255 * 100) | round(0) | int }}"
